<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

}
</script>
<style>
/* ── Platform tokens ───────────────────────────────────────────────────── */
:root {
  --c-bg:           #E7EFF6;
  --c-card:         #FFFFFF;
  --c-divider:      rgba(51,115,250,.16);
  --c-text-primary: #17223B;
  --c-text-second:  #677893;
  --c-accent:       #3373FA;
  --c-accent-2:     #6EA0FF;
  --c-accent-soft:  rgba(51,115,250,.10);
  --c-red:          #d84f4f;
  --c-green:        #4bb34b;
  --c-orange:       #d9922e;
  --c-pill-bg:      #F2F6FF;
  --c-skeleton:     #D8E5F3;
  --radius-card:    12px;
  --radius-btn:     10px;
  --safe-t: env(safe-area-inset-top,    0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left,   0px);
  --safe-r: env(safe-area-inset-right,  0px);
  --bar-h:  calc(56px + var(--safe-t));
  --tab-h:  0px;
  --font:   -apple-system,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
}
[data-theme="dark"] {
  --c-bg:           #0F172A;
  --c-card:         #17223B;
  --c-divider:      rgba(255,255,255,.12);
  --c-text-primary: #F8FBFF;
  --c-text-second:  #A9B8D3;
  --c-accent:       #6EA0FF;
  --c-accent-2:     #3373FA;
  --c-accent-soft:  rgba(110,160,255,.14);
  --c-pill-bg:      #203052;
  --c-skeleton:     #243655;
}

/* ── Reset ──────────────────────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{
  font-family:var(--font);
  font-size:15px;
  line-height:1.4;
  color:var(--c-text-primary);
  background:linear-gradient(180deg,#FFFFFF 0%,var(--c-bg) 100%);
  -webkit-tap-highlight-color:transparent;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;outline:none}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}

/* ── Layout ─────────────────────────────────────────────────────────────── */
#app{
  position:fixed;inset:0;
  display:flex;
  flex-direction:column;
  background:linear-gradient(180deg,#FFFFFF 0%,var(--c-bg) 100%);
}

/* ── Header ─────────────────────────────────────────────────────────────── */
#header{
  flex-shrink:0;
  height: var(--bar-h);
  display:flex;align-items:center;
  padding:0 16px;
  padding-top:var(--safe-t);
  background:var(--c-card);
  border-bottom:1px solid var(--c-divider);
  position:relative;
  z-index:10;
}
.header-back{
  display:none;align-items:center;gap:4px;
  color:var(--c-accent);font-size:17px;font-weight:400;
  padding:8px 8px 8px 0;margin-right:4px;
  transition:opacity .15s;
  position: relative;
  z-index: 2;
}
.header-back svg{width:11px;height:18px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round}
.header-back.visible{display:flex}
.header-back:active{opacity:.5}
#header-title{
  position: absolute;
  left: 50%;
  top: var(--safe-t);
  bottom: 0;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1;
}
.header-right{
  display:flex;align-items:center;
  min-width:60px;justify-content:flex-end;
  position: relative;
  z-index: 2;
  margin-left: auto;
}
.header-share-btn{
  color:var(--c-accent);
  font-size:15px;font-weight:400;
  padding:8px 0 8px 8px;
  display:none;
}
.header-share-btn:active{opacity:.5}
.header-share-btn.visible{display:block}

/* ── Tabs (Нижняя навигация) ────────────────────────────────────────────── */
#tabs{
  display:none !important;
  flex-shrink:0;
  height:0;
  grid-template-columns:1fr 1fr 1fr 1fr;
  background:var(--c-card);
  border-top:1px solid var(--c-divider);
  z-index:10;
}
.tab-btn{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;padding-bottom:var(--safe-b);
  color:var(--c-text-second);
  font-size:9px;font-weight:500;
  transition:color .15s;
  position:relative;
}
.tab-btn svg{width:22px;height:22px}
.tab-btn.active{color:var(--c-accent)}
.tab-btn:active{opacity:.6}
.tab-badge{
  position:absolute;top:6px;right:calc(50% - 20px);
  background:var(--c-red);color:#fff;
  font-size:9px;font-weight:700;line-height:1;
  padding:2px 4px;border-radius:10px;
  min-width:14px;text-align:center;
  display:none;
}
.tab-badge.show{display:block}

/* Карточки поиска/похожих */
.ad-card{
  background:var(--c-card);
  display:flex;gap:10px;align-items:center;
  padding:10px 12px;margin:0 0 1px;
  cursor:pointer;transition:background .15s;
}
.ad-card:active{background:var(--c-pill-bg)}
.ad-card-thumb{
  width:56px;height:56px;border-radius:8px;flex-shrink:0;
  background:var(--c-skeleton);overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  font-size:22px;color:var(--c-text-second);
}
.ad-card-thumb img{width:100%;height:100%;object-fit:cover}
.ad-card-info{flex:1;min-width:0}
.ad-card-price{font-size:15px;font-weight:700}
.ad-card-title{font-size:13px;color:var(--c-text-second);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.ad-card-meta{font-size:12px;color:var(--c-text-second);margin-top:2px}

/* Статистика */
.stat-card{background:var(--c-card);border-radius:12px;padding:14px 16px;margin:8px 12px 0}
.stat-row{display:flex;justify-content:space-between;align-items:center;
  padding:10px 0;border-bottom:1px solid var(--c-divider)}
.stat-row:last-child{border-bottom:none;padding-bottom:0}
.stat-label{font-size:14px;color:var(--c-text-second)}
.stat-val{font-size:15px;font-weight:600}
.stat-num{display:flex;gap:16px;justify-content:space-around}
.stat-num span{display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:20px;font-weight:700}
.stat-num small{font-size:11px;font-weight:400;color:var(--c-text-second)}

/* ── View container ─────────────────────────────────────────────────────── */
#views{
  flex:1;
  position:relative;
  overflow:hidden;
  background:var(--c-bg);
}
.view{
  position:absolute;inset:0;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  background:var(--c-bg);
}
/* Полное скрытие неактивных экранов для избежания артефактов на десктопе */
.view.hidden{
  display:none !important;
}

/* ── Skeleton ────────────────────────────────────────────────────────────── */
@keyframes shimmer{
  from{background-position:200% 0}
  to{background-position:-200% 0}
}
.sk{
  background:linear-gradient(90deg,var(--c-skeleton) 25%,
    color-mix(in srgb,var(--c-skeleton) 60%,var(--c-card)) 50%,
    var(--c-skeleton) 75%);
  background-size:200% 100%;
  animation:shimmer 1.4s infinite;
  border-radius:8px;
}

/* ── Gallery ─────────────────────────────────────────────────────────────── */
.gallery{
  position:relative;
  width:100%;
  aspect-ratio:4/3;
  background:var(--c-skeleton);
  overflow:hidden;
  cursor:pointer;
}
.gallery-slides{
  display:flex;
  height:100%;
  transition:transform .3s cubic-bezier(.4,0,.2,1);
  will-change:transform;
}
.gallery-slide{
  min-width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
  background:var(--c-skeleton);
}
.gallery-slide img{
  width:100%;height:100%;
  object-fit:cover;
}
.gallery-dots{
  position:absolute;bottom:10px;left:50%;transform:translateX(-50%);
  display:flex;gap:5px;
}
.gallery-dots span{
  width:6px;height:6px;border-radius:50%;
  background:rgba(255,255,255,.5);
  transition:background .2s,width .2s;
}
.gallery-dots span.active{background:#fff;width:14px;border-radius:3px}
.gallery-counter{
  position:absolute;bottom:10px;right:14px;
  background:rgba(0,0,0,.45);color:#fff;
  font-size:12px;font-weight:600;
  padding:3px 8px;border-radius:20px;
  display:none;
}
.gallery-no-photo{
  width:100%;aspect-ratio:4/3;
  display:flex;align-items:center;justify-content:center;
  background:var(--c-pill-bg);
  font-size:56px;color:var(--c-text-second);
}

/* ── Cards ───────────────────────────────────────────────────────────────── */
.card{
  background:var(--c-card);
  margin:0 0 8px;
  padding:14px 16px;
}
.card:first-child{border-radius:0 0 var(--radius-card) var(--radius-card)}
.card+.card{border-radius:var(--radius-card)}
.card-last{margin-bottom:16px}

/* ── Price + title ───────────────────────────────────────────────────────── */
.price{
  font-size:28px;font-weight:700;
  line-height:1.2;margin-bottom:4px;
}
.ad-title{
  font-size:18px;font-weight:600;
  line-height:1.3;margin-bottom:10px;
}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:2px}
.pill{
  background:var(--c-pill-bg);
  padding:4px 10px;border-radius:20px;
  font-size:13px;color:var(--c-text-second);
}
.pill.green{background:#ebf8eb;color:var(--c-green)}
.pill.orange{background:#fff3e0;color:var(--c-orange)}

/* ── Seller ──────────────────────────────────────────────────────────────── */
.seller-row{display:flex;align-items:center;gap:12px}
.seller-ava{
  width:42px;height:42px;border-radius:50%;flex-shrink:0;
  background:var(--c-accent-2);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:700;
  overflow:hidden;
}
.seller-ava img{width:100%;height:100%;object-fit:cover}
.seller-name{font-size:15px;font-weight:600}
.seller-sub{font-size:13px;color:var(--c-text-second);margin-top:1px}
.verified-badge{display:inline-block;margin-left:4px;vertical-align:middle;font-size:14px}

/* ── Meta rows ───────────────────────────────────────────────────────────── */
.meta-row{
  display:flex;align-items:flex-start;gap:8px;
  padding:10px 0;border-bottom:1px solid var(--c-divider);
  font-size:15px;
}
.meta-row:last-child{border-bottom:none;padding-bottom:0}
.meta-row:first-child{padding-top:0}
.meta-key{color:var(--c-text-second);flex:0 0 100px}
.meta-val{flex:1;color:var(--c-text-primary)}

/* ── Description ────────────────────────────────────────────────────────── */
.desc{
  font-size:15px;line-height:1.6;
  color:var(--c-text-primary);
  white-space:pre-wrap;
  word-break:break-word;
}
.desc-clamp{
  -webkit-line-clamp:5;
  -webkit-box-orient:vertical;
  display:-webkit-box;
  overflow:hidden;
}
.desc-more{
  display:none;
  color:var(--c-accent);font-size:14px;
  margin-top:6px;cursor:pointer;
}
.desc-more.show{display:block}

/* ── Action bar (bottom floating) ──────────────────────────────────────── */
.action-bar{
  position:sticky;bottom:0;
  background:var(--c-card);
  padding:8px 12px calc(8px + var(--safe-b));
  border-top:1px solid var(--c-divider);
  display:flex;gap:8px;
  z-index:5;
}
.btn{
  height:48px;border-radius:var(--radius-btn);
  font-size:16px;font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:6px;
  transition:opacity .12s,transform .1s;
  user-select:none;
  -webkit-user-select:none;
}
.btn-primary{flex:1;background:var(--c-accent);color:#fff}
.btn-fav{
  flex:0 0 52px;
  background:var(--c-pill-bg);
  color:var(--c-red);
  font-size:22px;
  transition:background .2s,color .2s,opacity .12s,transform .1s;
}
.btn-fav.is-fav{background:var(--c-red);color:#fff}

/* ── Favourites list ─────────────────────────────────────────────────────── */
.fav-list{padding:8px 0 16px}
.fav-item{
  background:var(--c-card);
  display:flex;align-items:center;gap:12px;
  padding:12px 16px;
  margin:0 0 1px;
  cursor:pointer;
  transition:background .15s;
  position:relative;
}
.fav-item:first-child{border-radius:var(--radius-card) var(--radius-card) 0 0}
.fav-item:last-child{border-radius:0 0 var(--radius-card) var(--radius-card);margin-bottom:0}
.fav-item:only-child{border-radius:var(--radius-card)}
.fav-item:active{background:var(--c-pill-bg)}
.fav-thumb{
  width:64px;height:64px;border-radius:8px;flex-shrink:0;
  background:var(--c-skeleton);overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  font-size:26px;color:var(--c-text-second);
}
.fav-thumb img{width:100%;height:100%;object-fit:cover}
.fav-info{flex:1;min-width:0}
.fav-price{font-size:17px;font-weight:700;margin-bottom:2px}
.fav-title{font-size:14px;color:var(--c-text-second);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fav-city{font-size:12px;color:var(--c-text-second);margin-top:2px}
.fav-del{
  color:var(--c-text-second);font-size:20px;
  padding:8px;margin:-8px;flex-shrink:0;
  transition:color .15s;
}
.fav-del:active{color:var(--c-red)}

.fav-sep{
  padding:14px 16px 6px;
  font-size:13px;font-weight:600;
  color:var(--c-text-second);
  text-transform:uppercase;letter-spacing:.5px;
}
.fav-empty{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:80px 32px;text-align:center;gap:12px;
}
.fav-empty-icon{font-size:64px;line-height:1}
.fav-empty-title{font-size:20px;font-weight:700}
.fav-empty-text{font-size:15px;color:var(--c-text-second);line-height:1.5}



/* ── Platform polish + motion ──────────────────────────────────────────── */
#header{
  box-shadow:0 8px 24px rgba(51,115,250,.06);
}
#tabs{
  box-shadow:0 -10px 30px rgba(23,34,59,.06);
}
.tab-btn svg{transition:transform .2s ease,filter .2s ease}
.tab-btn.active svg{transform:translateY(-1px);filter:drop-shadow(0 4px 8px rgba(51,115,250,.22))}
.platform-search-input{
  box-shadow:0 8px 22px rgba(51,115,250,.07);
  transition:border-color .18s ease,box-shadow .18s ease,transform .18s ease;
}
.platform-search-input:focus{
  border-color:var(--c-accent)!important;
  box-shadow:0 10px 28px rgba(51,115,250,.16);
  transform:translateY(-1px);
}
.platform-icon-btn{
  width:30px;height:30px;border-radius:10px;
  justify-content:center;background:var(--c-accent-soft);
  color:var(--c-accent)!important;
  transition:transform .18s ease,background .18s ease;
}
.platform-icon-btn:active{transform:scale(.94);background:rgba(51,115,250,.18)}
.ad-card,.fav-item,.stats-card,.stats-chart-card{
  border:1px solid rgba(51,115,250,.08);
  box-shadow:0 8px 24px rgba(23,34,59,.04);
}
.ad-card,.fav-item,.stats-card{animation:softRise .28s ease both}
.btn-primary, #view-search button[onclick="doSearch()"]{
  box-shadow:0 10px 22px rgba(51,115,250,.22);
}
.stats-hero-illustration{
  position:absolute;
  right:10px;
  top:50%;
  width:clamp(76px,24vw,112px);
  height:auto;
  max-height:112px;
  object-fit:contain;
  opacity:.98;
  z-index:1;
  filter:drop-shadow(0 14px 22px rgba(23,34,59,.14));
  transform:translate3d(0,-50%,0) rotate(-2deg);
  transform-origin:50% 55%;
  animation:heroFloat 5.5s ease-in-out infinite;
  pointer-events:none;
  will-change:transform;
}
@keyframes softRise{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes heroFloat{
  0%,100%{transform:translate3d(0,-50%,0) rotate(-2deg)}
  50%{transform:translate3d(-5px,calc(-50% + 5px),0) rotate(1deg)}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

/* ── My ads dashboard ───────────────────────────────────────────────────── */
.stats-dashboard{
  padding:12px 12px 20px;
}
.stats-hero{
  position:relative;
  overflow:hidden;
  border-radius:22px;
  min-height:152px;
  padding:18px 112px 18px 18px;
  color:#fff;
  background:linear-gradient(135deg,#3373FA 0%,#5D92FF 56%,#E7EFF6 145%);
  box-shadow:0 16px 36px rgba(51,115,250,.26);
}
.stats-hero::before,.stats-hero::after{display:none}
.stats-hero-title{font-size:14px;font-weight:600;opacity:.95;margin-bottom:10px;position:relative;z-index:2}
.stats-hero-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;position:relative;z-index:2;width:100%}
.stats-hero-item{
  min-width:0;
  background:rgba(255,255,255,.18);
  border:1px solid rgba(255,255,255,.24);
  border-radius:14px;
  padding:10px 6px;
  backdrop-filter:blur(8px);
}
.stats-hero-value{font-size:21px;font-weight:800;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats-hero-label{font-size:10px;opacity:.82;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:380px){
  .stats-hero{padding-right:88px;min-height:148px}
  .stats-hero-illustration{right:4px;width:82px;max-height:96px}
  .stats-hero-item{padding:9px 5px}
  .stats-hero-value{font-size:19px}
  .stats-hero-label{font-size:9.5px}
}
@media (max-width:330px){
  .stats-hero{padding-right:78px}
  .stats-hero-illustration{right:2px;width:74px;max-height:88px}
  .stats-hero-grid{gap:5px}
  .stats-hero-item{padding:8px 4px}
  .stats-hero-value{font-size:18px}
  .stats-hero-label{font-size:9px}
}
.stats-section-title{
  padding:16px 4px 8px;
  font-size:13px;font-weight:700;
  color:var(--c-text-second);
  text-transform:uppercase;letter-spacing:.5px;
}
.stats-chart-card{
  background:var(--c-card);
  border-radius:16px;
  padding:14px;
  margin-top:10px;
  box-shadow:0 1px 0 rgba(0,0,0,.03);
}
.stats-bars{display:flex;align-items:flex-end;gap:8px;height:112px;margin:8px 0 6px}
.stats-bar-wrap{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px}
.stats-bar{
  width:100%;max-width:34px;min-height:6px;
  border-radius:10px 10px 4px 4px;
  background:linear-gradient(180deg,#3373FA,#8BB4FF);
  transition:height .45s ease;
}
.stats-bar-label{font-size:10px;color:var(--c-text-second);max-width:44px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.stats-card{
  background:var(--c-card);
  border-radius:16px;
  padding:12px;
  margin-top:10px;
  box-shadow:0 1px 0 rgba(0,0,0,.03);
  cursor:pointer;
  transition:transform .12s,background .15s;
}
.stats-card:active{transform:scale(.985);background:var(--c-pill-bg)}
.stats-card-top{display:flex;gap:12px;align-items:center}
.stats-thumb{
  width:64px;height:64px;border-radius:14px;overflow:hidden;flex-shrink:0;
  background:var(--c-skeleton);display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--c-text-second);
}
.stats-thumb img{width:100%;height:100%;object-fit:cover}
.stats-info{flex:1;min-width:0}
.stats-title{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats-price{font-size:13px;color:var(--c-text-second);margin-top:2px}
.stats-status{
  display:inline-flex;align-items:center;gap:5px;
  margin-top:8px;padding:4px 8px;border-radius:999px;
  font-size:12px;font-weight:600;
}
.stats-status.active{background:rgba(75,179,75,.12);color:var(--c-green)}
.stats-status.moderation{background:rgba(255,160,0,.14);color:var(--c-orange)}
.stats-status.inactive{background:var(--c-pill-bg);color:var(--c-text-second)}
.stats-status-dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.stats-numbers{display:flex;gap:8px;align-items:center;flex-shrink:0}
.stats-mini{
  min-width:54px;text-align:center;
  background:var(--c-pill-bg);border-radius:12px;
  padding:7px 6px;
}
.stats-mini-value{font-size:15px;font-weight:800}
.stats-mini-label{font-size:10px;color:var(--c-text-second);margin-top:1px}
.stats-chevron{color:var(--c-text-second);font-size:20px;transition:transform .2s}
.stats-detail{display:none;margin-top:14px;padding-top:14px;border-top:1px solid var(--c-divider)}
.stats-line{margin-bottom:12px}
.stats-line-head{display:flex;justify-content:space-between;font-size:12px;color:var(--c-text-second);margin-bottom:6px}
.stats-progress{height:9px;background:var(--c-pill-bg);border-radius:999px;overflow:hidden}
.stats-progress-fill{height:100%;border-radius:999px;transition:width .5s ease}
.stats-progress-fill.views{background:linear-gradient(90deg,#3373FA,#8BB4FF)}
.stats-progress-fill.favs{background:linear-gradient(90deg,#6EA0FF,#3373FA)}
.stats-hint{font-size:11px;color:var(--c-text-second);line-height:1.4;margin-top:10px;text-align:center}


/* ── Цветные статичные иконки вместо системных эмодзи ───────────────────── */
.mono-icon,
.static-icon{
  width:1.15em;height:1.15em;display:inline-block;vertical-align:-.18em;
  color:currentColor;flex-shrink:0;
}
.empty-icon{width:64px;height:64px;color:var(--c-accent);opacity:.9}
.chart-icon{width:24px;height:24px;color:var(--c-accent)}
.placeholder-icon{width:24px;height:24px;color:var(--c-text-second)}
.fav-button-icon{width:24px;height:24px;color:currentColor}
.static-icon-photo{color:#6EA0FF}
.static-icon-search{color:#3373FA}
.static-icon-empty{color:#8BB4FF}
.static-icon-chart{color:#3373FA}
.static-icon-view{color:#43A5F5}
.static-icon-calendar{color:#8B6BFF}
.static-icon-fav,.static-icon-favFilled{color:#FF5C7A}
.static-icon-close{color:#8A98AF}
.static-icon-tag{color:#F2A23A}
.static-icon-ok{color:#4BB34B}
.static-icon-wait{color:#F2A23A}
.fav-empty .empty-icon{margin-bottom:2px}
.chip-close-icon{width:13px;height:13px;margin-left:4px;vertical-align:-.16em;color:currentColor}
.fav-del .mono-icon{width:20px;height:20px}
.error-icon .empty-icon{display:block}
.stat-line-head-icon{display:inline-flex;align-items:center;gap:5px}
.search-empty-state{padding:72px 28px;text-align:center;color:var(--c-text-second)}
.search-empty-state .empty-icon{margin:0 auto 14px;display:block}
.search-empty-title{font-size:18px;font-weight:700;color:var(--c-text-primary);margin-bottom:6px}
.search-empty-text{font-size:14px;line-height:1.45}

/* ── Error / 404 ────────────────────────────────────────────────────────── */
.error-screen{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:50vh;padding:40px;text-align:center;gap:10px;
}
.error-icon{font-size:64px}
.error-title{font-size:22px;font-weight:700}
.error-text{font-size:15px;color:var(--c-text-second);line-height:1.5}

/* ── Toast ───────────────────────────────────────────────────────────────── */
#toast{
  position:fixed;bottom:calc(var(--tab-h) + 12px);left:50%;
  transform:translateX(-50%) translateY(20px);
  background:rgba(0,0,0,.8);color:#fff;
  padding:10px 18px;border-radius:24px;
  font-size:14px;pointer-events:none;opacity:0;
  transition:opacity .2s,transform .2s;
  z-index:1000;
  max-width:calc(100vw - 32px);
  white-space:normal;text-align:center;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── Misc ────────────────────────────────────────────────────────────────── */
.divider{border:none;border-top:1px solid var(--c-divider);margin:0}
.stats-row{
  display:flex;gap:16px;font-size:13px;color:var(--c-text-second);
  margin-top:6px;
}
.stats-row span{display:flex;align-items:center;gap:4px}
.spinner{
  display:flex;align-items:center;justify-content:center;

}
.spin{
  width:28px;height:28px;border-radius:50%;
  border:3px solid var(--c-divider);
  border-top-color:var(--c-accent);
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* Анимация сканирования фото */
@keyframes scan-laser {
  0% { top: 0%; }
  50% { top: 100%; }
  100% { top: 0%; }
}

<script>
const CFG = {
  API_BASE:   "https://polka-api.onrender.com",
  BOT_GROUP:  "238149306",              // ID группы (без минуса)
  VK_APP_ID:  54623990,
};

const STATE = {
  vkUserId:     0,
  vkUserPhoto:  "",
  launchParams: "",
  adData:       null,
  adId:         0,
  isFavorite:   false,
  favsData:     null,       // null = не загружены
  favsLoading:  false,
  curPhoto:     0,
  touchX0:      0,
  touchY0:      0,
  activeTab:    "",         // Пустая строка при инициализации позволяет switchTab() сработать корректно на старте
  descExpanded: false,
  filtersLoaded: false,
  initialSearchDone: false,
};

async function initVK() {
  // Читаем user_id из URL параметров (VK всегда передаёт их)
  STATE.launchParams = window.location.search.slice(1);
  try {
    const uid = new URLSearchParams(window.location.search).get("vk_user_id");
    if (uid) STATE.vkUserId = parseInt(uid);
  } catch(_) {}

  // VK Bridge — пробуем но не ждём и не падаем
  try {
    await Promise.race([
      vkBridge.send("VKWebAppInit"),
      new Promise(r => setTimeout(r, 2000))
    ]);
    try {
      const u = await vkBridge.send("VKWebAppGetUserInfo");
      if (u && u.id) { STATE.vkUserId = u.id; STATE.vkUserPhoto = u.photo_100 || ""; }
    } catch(_) {}
    try {
      const cfg = await vkBridge.send("VKWebAppGetConfig");
      if (cfg && cfg.appearance === "dark")
        document.documentElement.setAttribute("data-theme","dark");
    } catch(_) {}
  } catch(_) {}
}

async function haptic(style="light") {
  try { await vkBridge.send("VKWebAppTapticImpactOccurred", { style }); } catch(_) {}
}

async function apiFetch(path, opts={}) {
  const headers = {
    "X-VK-Sign":                STATE.launchParams,
    "X-VK-User-Id":             String(STATE.vkUserId),
    "Content-Type":             "application/json",
    "ngrok-skip-browser-warning": "true",
    ...(opts.headers||{}),
  };
  const res = await fetch(CFG.API_BASE + path, { ...opts, headers });
  if (!res.ok) throw Object.assign(new Error("API error"), { status: res.status });
  return res.json();
}

function switchTab(tab) {
  // Приложение открывается только как карточка объявления из поста.
  // Поиск, избранное отдельной вкладкой и статистика остаются в боте.
  if (tab !== "ad") tab = "ad";
  STATE.activeTab = tab;
  
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
  const currentTabBtn = document.getElementById(`tab-${tab}`);
  if (currentTabBtn) currentTabBtn.classList.add("active");
  
  ["ad","favs","search","stats"].forEach(v => {
    const el = document.getElementById(`view-${v}`);
    if (el) el.classList.toggle("hidden", v !== tab);
  });
  
  if (tab === "favs") {
    setHeader(false, false);
    if (!STATE.favsData) loadFavs();
  } else if (tab === "search") {
    setHeader(false, false);
  } else if (tab === "stats") {
    setHeader(false, false);
    loadStats(); // Загружаем статистику заново для обновления просмотров
  } else {
    setHeader(false, !!STATE.adData);
  }
}

let _searchTimer = null;
function onSearchInput() {
  clearTimeout(_searchTimer);
  const q = document.getElementById("search-input")?.value.trim() || "";
  if (!q) {
    showSearchEmptyState();
    return;
  }
  if (q.length < 2) return;
  _searchTimer = setTimeout(doSearch, 420);
}

function monoIcon(name, cls="mono-icon") {
  const iconCls = `${cls} static-icon static-icon-${name}`;
  const icons = {
    photo: '<svg class="'+iconCls+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="11" r="2"/><path d="M21 16l-5-5-4 4-2-2-5 5"/></svg>',
    search: '<svg class="'+iconCls+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>',
    empty: '<svg class="'+iconCls+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M9 13h6"/></svg>',
    chart: '<svg class="'+iconCls+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5"/><path d="M4 19h16"/><path d="M8 16v-4"/><path d="M12 16V8"/><path d="M16 16v-6"/></svg>',
    view: '<svg class="'+iconCls+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6z"/><circle cx="12" cy="12" r="3"/></svg>',
    calendar: '<svg class="'+iconCls+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>',
    fav: '<svg class="'+iconCls+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.4 5.4 0 0 0-7.7 0L12 5.7l-1.1-1.1a5.4 5.4 0 0 0-7.7 7.7L12 21l8.8-8.7a5.4 5.4 0 0 0 0-7.7z"/></svg>',
    favFilled: '<svg class="'+iconCls+'" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.4 5.4 0 0 0-7.7 0L12 5.7l-1.1-1.1a5.4 5.4 0 0 0-7.7 7.7L12 21l8.8-8.7a5.4 5.4 0 0 0 0-7.7z"/></svg>',
    close: '<svg class="'+iconCls+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    tag: '<svg class="'+iconCls+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12V6a2 2 0 0 1 2-2h6l8 8-8 8-8-8z"/><circle cx="9" cy="9" r="1.4"/></svg>',
    ok: '<svg class="'+iconCls+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
    wait: '<svg class="'+iconCls+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v5l3 2"/></svg>'
  };
  return icons[name] || icons.empty;
}

function favIconHtml(active=false, cls="fav-button-icon") {
  return monoIcon(active ? "favFilled" : "fav", cls);
}

function setFavButton(btn, active) {
  if (!btn) return;
  btn.innerHTML = favIconHtml(active);
  btn.classList.toggle("is-fav", active);
}

function showSearchEmptyState() {
  const q    = document.getElementById("search-input")?.value.trim() || "";
  const city = document.getElementById("f-city")?.value || "";
  const cat  = document.getElementById("f-cat")?.value || "";
  const minP = document.getElementById("f-min")?.value || "";
  const maxP = document.getElementById("f-max")?.value || "";
  const wrap = document.getElementById("search-results");
  if (!wrap || q || city || cat || minP || maxP) return;
  document.getElementById("filter-chips").innerHTML = "";
  wrap.innerHTML = `<div class="search-empty-state">${monoIcon("search","empty-icon")}<div class="search-empty-title">Начните поиск</div><div class="search-empty-text">Введите запрос, выберите фильтры или загрузите фото товара.</div></div>`;
}

async function doPhotoSearch(e) {
  const file = e.target.files?.[0];
  if (!file) return;
  haptic("medium");

  const overlay = document.getElementById("scan-overlay");
  const preview = document.getElementById("scan-preview");
  if (overlay && preview) {
    preview.src = URL.createObjectURL(file);
    overlay.style.display = "flex";
  }

  const fd = new FormData();
  fd.append("photo", file);

  try {
    const res = await fetch(CFG.API_BASE + "/api/search-by-photo", {
      method: "POST",
      headers: {
        "X-VK-Sign": STATE.launchParams,
        "X-VK-User-Id": String(STATE.vkUserId),
        "ngrok-skip-browser-warning": "true"
      },
      body: fd
    });

    if (!res.ok) throw new Error("API error");
    const data = await res.json();

    if (overlay) overlay.style.display = "none";

    const wrap = document.getElementById("search-results");
    renderAdList(wrap, data.items, data.total, "Найдено по фото");
    
    e.target.value = "";
  } catch(err) {
    if (overlay) overlay.style.display = "none";
    showToast("Не удалось распознать фото");
  }
}

function toggleFilters() {
  const p = document.getElementById("filter-panel");
  p.style.display = p.style.display === "none" ? "" : "none";
}

async function loadFilters() {
  try {
    const data = await apiFetch("/api/filters");
    const cityEl = document.getElementById("f-city");
    const catEl  = document.getElementById("f-cat");
    
    cityEl.innerHTML = '<option value="">Все города</option>';
    catEl.innerHTML = '<option value="">Все категории</option>';

    (data.cities||[]).forEach(c => {
      cityEl.innerHTML += `<option value="${esc(c)}">${esc(c)}</option>`;
    });
    (data.categories||[]).forEach(c => {
      catEl.innerHTML += `<option value="${esc(c)}">${esc(c)}</option>`;
    });
    STATE.filtersLoaded = true;
  } catch(_) {}
}

async function doSearch() {
  const q    = document.getElementById("search-input")?.value.trim() || "";
  const city = document.getElementById("f-city")?.value || "";
  const cat  = document.getElementById("f-cat")?.value || "";
  const minP = document.getElementById("f-min")?.value || "";
  const maxP = document.getElementById("f-max")?.value || "";

  const wrap = document.getElementById("search-results");

  const chips = [];
  if (city) chips.push(`<span class="pill" onclick="clearFilter('city')" style="cursor:pointer">${esc(city)} ${monoIcon("close","chip-close-icon")}</span>`);
  if (cat)  chips.push(`<span class="pill" onclick="clearFilter('cat')"  style="cursor:pointer">${esc(cat)} ${monoIcon("close","chip-close-icon")}</span>`);
  if (minP||maxP) chips.push(`<span class="pill" onclick="clearFilter('price')" style="cursor:pointer">${minP||'0'} — ${maxP||'∞'} ₽ ${monoIcon("close","chip-close-icon")}</span>`);
  document.getElementById("filter-chips").innerHTML = chips.join("");

  if (!q && !city && !cat && !minP && !maxP) {
    showSearchEmptyState();
    return;
  }

  wrap.innerHTML = `<div class="spinner" style="padding:32px"><div class="spin"></div></div>`;

  try {
    const params = new URLSearchParams();
    if (q)    params.set("q", q);
    if (city) params.set("city", city);
    if (cat)  params.set("category", cat);
    if (minP) params.set("min_price", minP);
    if (maxP) params.set("max_price", maxP);
    const data = await apiFetch(`/api/search?${params}`);
    renderAdList(wrap, data.items, data.total, q || "Фильтры");
  } catch(_) {
    wrap.innerHTML = `<div class="error-screen"><div class="error-icon"><svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9h.01M15 9h.01M8 16c1.1-1 2.4-1.5 4-1.5s2.9.5 4 1.5"/></svg></div><div class="error-title">Ошибка загрузки</div></div>`;
  }
}

function clearFilter(type) {
  if (type==="city")  document.getElementById("f-city").value = "";
  if (type==="cat")   document.getElementById("f-cat").value = "";
  if (type==="price") { document.getElementById("f-min").value=""; document.getElementById("f-max").value=""; }
  doSearch();
}

function renderAdList(wrap, items, total, label) {
  if (!items || !items.length) {
    wrap.innerHTML = `<div class="fav-empty"><div class="fav-empty-icon">${monoIcon("search","empty-icon")}</div>
      <div class="fav-empty-title">Ничего не найдено</div>
      <div class="fav-empty-text">Попробуйте изменить запрос или фильтры</div></div>`;
    return;
  }
  wrap.innerHTML = `
    <div class="fav-sep">${esc(label)} · ${total}</div>
    ${items.map(ad => adCardHtml(ad)).join("")}`;
}

function adCardHtml(ad) {
  const photos = ad.photos || [];
  const thumb = photos[0]
    ? `<img src="${esc(photos[0])}" loading="lazy">`
    : monoIcon("photo","placeholder-icon");
  const categoryStr = ad.category ? " · " + esc(ad.category.replace(/^·\s*/,"")) : "";
  return `<div class="ad-card" onclick="openAdFromFav(${ad.id})">
    <div class="ad-card-thumb">${thumb}</div>
    <div class="ad-card-info">
      <div class="ad-card-price">${fmtPrice(ad.price)}</div>
      <div class="ad-card-title">${esc(ad.title || "Без названия")}</div>
      <div class="ad-card-meta">${esc(ad.city||"")}${categoryStr}</div>
    </div>
  </div>`;
}

async function loadStats() {
  try {
    const data = await apiFetch("/api/my/stats");
    STATE.statsLoaded = true;
    renderStats(data.items || []);
  } catch(e) {
    document.getElementById("stats-skeleton").innerHTML =
      `<div class="error-screen"><div class="error-icon"><svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9h.01M15 9h.01M8 16c1.1-1 2.4-1.5 4-1.5s2.9.5 4 1.5"/></svg></div><div class="error-title">Не удалось загрузить</div></div>`;
  }
}

function normalizeAdStatus(status) {
  const raw = String(status || "active").trim().toLowerCase();
  if (!raw || ["active", "published", "publish", "posted", "open", "активно", "активный", "опубликовано", "размещено"].includes(raw)) {
    return { key: "active", label: "Активно" };
  }
  if (["moderation", "pending", "review", "на модерации", "модерация", "ожидает"].includes(raw)) {
    return { key: "moderation", label: "На модерации" };
  }
  if (["inactive", "closed", "archived", "deleted", "removed", "sold", "hidden", "снято", "закрыто", "архив", "продано", "удалено", "скрыто"].includes(raw)) {
    return { key: "inactive", label: "Снято" };
  }
  return { key: "active", label: "Активно" };
}

            const h = Math.max(8, Math.round(ad._views / maxViews * 100));
            return `<div class="stats-bar-wrap" title="${esc(ad._title)} · ${fmtNum(ad._views)}">
              <div class="stats-bar" style="height:${h}%"></div>
              <div class="stats-bar-label">${esc(trimTitle(ad._title, 10))}</div>
            </div>`;
          }).join("")}
        </div>
      </div>

      <div class="stats-section-title">Список объявлений</div>
      ${prepared.map(ad => {
        const viewsPct = Math.max(3, Math.round(ad._views / maxViews * 100));
        const favsPct  = Math.max(3, Math.round(ad._favs / maxFavs * 100));
        return `
        <div class="stats-card" onclick="toggleStatChart(${ad._idx})">
          <div class="stats-card-top">
            <div class="stats-thumb">
              ${ad.photo ? `<img src="${esc(ad.photo)}" loading="lazy">` : monoIcon("photo","placeholder-icon")}
            </div>
            <div class="stats-info">
              <div class="stats-title">${esc(ad._title)}</div>
              <div class="stats-price">${fmtPrice(ad.price)}</div>
              <div class="stats-status ${ad._status.key}"><span class="stats-status-dot"></span>${ad._status.label}</div>
            </div>
            <div class="stats-numbers">
              <div class="stats-mini">
                <div class="stats-mini-value">${fmtNum(ad._views)}</div>
                <div class="stats-mini-label">просм.</div>
              </div>
              <div class="stats-mini">
                <div class="stats-mini-value">${fmtNum(ad._favs)}</div>
                <div class="stats-mini-label">избр.</div>
              </div>
              <div class="stats-chevron" id="stat-chevron-${ad._idx}">›</div>
            </div>
          </div>
          <div class="stats-detail" id="stat-chart-${ad._idx}">
            <div class="stats-line">
              <div class="stats-line-head"><span class="stat-line-head-icon">${monoIcon("view")} Просмотры</span><span>${fmtNum(ad._views)}</span></div>
              <div class="stats-progress"><div class="stats-progress-fill views" style="width:${viewsPct}%"></div></div>
            </div>
            <div class="stats-line">
              <div class="stats-line-head"><span class="stat-line-head-icon">${monoIcon("fav")} Добавили в избранное</span><span>${fmtNum(ad._favs)}</span></div>
              <div class="stats-progress"><div class="stats-progress-fill favs" style="width:${favsPct}%"></div></div>
            </div>
            <div class="stats-hint">Полосы показывают результат относительно самого сильного объявления в вашем списке.</div>
          </div>
        </div>`;
      }).join("")}
    </div>`;
}

function toggleStatChart(idx) {
  const chart = document.getElementById(`stat-chart-${idx}`);
  const chevron = document.getElementById(`stat-chevron-${idx}`);
  if (!chart) return;
  const isOpen = chart.style.display !== "none" && chart.style.display !== "";
  chart.style.display = isOpen ? "none" : "block";
  if (chevron) chevron.style.transform = isOpen ? "rotate(0deg)" : "rotate(90deg)";
  haptic("light");
}

function navigateBack() {
  try {
    vkBridge.send("VKWebAppClose", { status: "success" });
  } catch (_) {
    if (history.length > 1) history.back();
  }
}

function setHeader(backBtn, shareBtn) {
  document.getElementById("btn-back").classList.toggle("visible", backBtn);
  document.getElementById("btn-share").classList.toggle("visible", shareBtn);
}

  STATE.adId = adId;

  document.getElementById("ad-content").style.display  = "none";
  document.getElementById("ad-error").style.display    = "none";

  try {
    console.log("Загружаем объявление", adId);
    const data = await apiFetch(`/api/ad/${adId}`);
    
    console.log("Данные получены:", data); // для отладки
    
    STATE.adData    = data;

        <div class="error-icon"><svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg></div>
        <div class="error-title">Ошибка соединения</div>
        <div class="error-text">Сервер ответил, но приложение не смогло обработать данные.<br>Попробуйте перезагрузить.</div>`;
    }

  setHeader(true, false);
}
  
function renderAd(d) {
  const photos = d.photos || [];
  STATE.curPhoto = 0;

  let galleryHtml = "";
  if (photos.length > 0) {
    const slides = photos.map(url =>
      `<div class="gallery-slide"><img src="${esc(url)}" loading="lazy" decoding="async"></div>`
    ).join("");
    const dots = photos.length > 1
      ? `<div class="gallery-dots">${photos.map((_,i)=>`<span class="${i===0?"active":""}"></span>`).join("")}</div>`
      : "";
    galleryHtml = `
      <div class="gallery" id="gallery" ontouchstart="gtStart(event)" ontouchend="gtEnd(event)" onclick="galleryTap(event)">
        <div class="gallery-slides" id="gallery-slides">${slides}</div>
        ${dots}
        <div class="gallery-counter" id="gallery-counter">${photos.length>1?`1 / ${photos.length}`:""}</div>
      </div>`;
  } else {
    galleryHtml = `<div class="gallery-no-photo">${monoIcon("photo","empty-icon")}</div>`;
  }

  const pills = [];
  if (d.condition) {
    const isNew = d.condition.toLowerCase().includes("нов");
    pills.push(`<span class="pill ${isNew?"green":""}">${esc(d.condition)}</span>`);
  }
  if (d.category) pills.push(`<span class="pill">${esc(stripDot(d.category))}</span>`);
  if (d.city)     pills.push(`<span class="pill">${esc(d.city)}</span>`);
  if (d.size)     pills.push(`<span class="pill">Размер: ${esc(d.size)}</span>`);
  if (d.gender)   pills.push(`<span class="pill">${esc(stripDot(d.gender))}</span>`);

  const s = d.seller || {};
  const sellerId = s.id || 0;
  const sellerInitial = (s.name || "П")[0].toUpperCase();
  const avaHtml = `
    <img src="${s.photo_100 || 'https://vk.com/images/camera_200.png'}" alt=""
         onerror="this.style.display=&quot;none&quot;;this.parentNode.textContent=&quot;${sellerInitial}&quot;"
         onload="this.style.display=&quot;block&quot;"
         style="width:100%;height:100%;object-fit:cover;display:none"
         data-uid="${sellerId}">`;

  const verBadge = s.is_verified ? `<span class="verified-badge">${monoIcon("ok")}</span>` : "";

  const addrVal = d.address
    ? `<a href="https://yandex.ru/maps/?text=${encodeURIComponent((d.city||'')+' '+d.address)}"
         onclick="openVKLink(this.href);return false;" style="color:var(--c-accent);text-decoration:none">${esc(d.address)}</a>`
    : "";

  const metaRows = [
    d.rooms           && ["Комнат",    `<span class="meta-val">${esc(d.rooms)}</span>`],
    d.area            && ["Площадь",   `<span class="meta-val">${esc(d.area)}</span>`],
    d.address         && ["Адрес",     `<span class="meta-val">${addrVal}</span>`],
    d.employment_type && ["Занятость", `<span class="meta-val">${esc(d.employment_type)}</span>`],
  ].filter(Boolean);

  const metaHtml = metaRows.length ? `
    <div class="card card-last">
      ${metaRows.map(([k,v])=>`
        <div class="meta-row">
          <span class="meta-key">${esc(k)}</span>
          ${v}
        </div>`).join("")}
    </div>` : "";

  const statsHtml = `
    <div class="stats-row" style="margin-top:10px">
      <span>${monoIcon("view")} ${fmtNum(d.views)} просмотров</span>
      ${d.created_at ? `<span>${monoIcon("calendar")} ${fmtDate(d.created_at)}</span>` : ""}
    </div>`;

  const descLong = d.description && d.description.length > 280;
  const descHtml = d.description ? `
    <div class="card">
      <div class="desc ${descLong?"desc-clamp":""}" id="desc-text">${esc(d.description)}</div>
      <div class="desc-more ${descLong?"show":""}" id="desc-more" onclick="expandDesc()">Читать полностью</div>
    </div>` : "";

  const contactHtml = d.contact_info ? `
    <div class="card">
      <div class="meta-row" style="padding:0">
        <span class="meta-key">Контакт</span>
        <span class="meta-val" style="word-break:break-all">${esc(d.contact_info)}</span>
      </div>
    </div>` : "";

  const statsOwnerHtml = (d.is_owner && d.seller_stats) ? `
    <div class="card">
      <div style="font-size:13px;font-weight:600;color:var(--c-text-second);margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px">Статистика</div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center">
        <div style="background:var(--c-pill-bg);border-radius:10px;padding:10px 4px">
          <div style="font-size:20px;font-weight:700">${fmtNum(d.views)}</div>
          <div style="font-size:11px;color:var(--c-text-second);margin-top:2px">просмотров</div>
        </div>
        <div style="background:var(--c-pill-bg);border-radius:10px;padding:10px 4px">
          <div style="font-size:20px;font-weight:700">${fmtNum(d.favorites_count||0)}</div>
          <div style="font-size:11px;color:var(--c-text-second);margin-top:2px">в избранном</div>
        </div>
        <div style="background:var(--c-pill-bg);border-radius:10px;padding:10px 4px">
          <div style="font-size:20px;font-weight:700">${fmtNum(d.seller_stats.ads_count||0)}</div>
          <div style="font-size:11px;color:var(--c-text-second);margin-top:2px">объявлений</div>
        </div>
      </div>
    </div>` : "";

  const similarHtml = (d.similar && d.similar.length > 0) ? `
    <div style="padding:14px 16px 6px;font-size:13px;font-weight:600;color:var(--c-text-second);text-transform:uppercase;letter-spacing:.5px">Похожие</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 12px 16px">
      ${d.similar.map(s => `
        <div onclick="openAdFromFav(${s.id})" style="background:var(--c-card);border-radius:12px;overflow:hidden;cursor:pointer;transition:opacity .15s"
             onmousedown="this.style.opacity='.7'" onmouseup="this.style.opacity='1'">
          <div style="aspect-ratio:1;background:var(--c-skeleton);overflow:hidden">
            ${s.photos&&s.photos[0]
              ? `<img src="${esc(s.photos[0])}" style="width:100%;height:100%;object-fit:cover" loading="lazy">`
              : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--c-text-second)">${monoIcon("photo","placeholder-icon")}</div>`}
          </div>
          <div style="padding:8px">
            <div style="font-size:14px;font-weight:700">${fmtPrice(s.price)}</div>
            <div style="font-size:12px;color:var(--c-text-second);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(s.title || "Без названия")}</div>
          </div>
        </div>`).join("")}
    </div>` : "";

  const actionBar = d.is_owner ? "" : `
    <div class="action-bar">
      <button class="btn btn-primary" onclick="contactSeller()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        Написать продавцу
      </button>
      <button class="btn btn-fav ${STATE.isFavorite?"is-fav":""}" id="btn-fav" onclick="toggleFavorite()" title="${STATE.isFavorite?"Убрать из избранного":"В избранное"}">
        ${favIconHtml(STATE.isFavorite)}
      </button>
    </div>`;

  document.getElementById("ad-skeleton").style.display = "none";
  document.getElementById("ad-content").style.display  = "";
  document.getElementById("ad-content").innerHTML = `
    ${galleryHtml}
    <div class="card" style="border-radius:0 0 ${(metaRows.length||d.description||d.contact_info) ? `0 0` : `12px 12px`}">
      <div class="price">${fmtPrice(d.price)}</div>
      <div class="ad-title">${esc(d.title || "Без названия")}</div>
      <div class="pills">${pills.join("")}</div>
      ${statsHtml}
    </div>
    <div class="card">
      <div class="seller-row">
        <div class="seller-ava">${avaHtml}</div>
        <div>
          <div class="seller-name">${esc(s.name||"Продавец")}${verBadge}</div>
          <div class="seller-sub">Продавец${d.is_owner?" · Это вы":""}</div>
        </div>
      </div>
    </div>
    ${descHtml}
    ${contactHtml}
    ${metaHtml}
    ${statsOwnerHtml}
    ${similarHtml}
    ${actionBar}
    <div style="height:8px"></div>
  `;

  if (photos.length > 1) {
    const gc = document.getElementById("gallery-counter");
    if (gc) gc.style.display = "block";
  }

  setTimeout(async () => {
    const img = document.querySelector(`[data-uid="${sellerId}"]`);
    if (!img) return;
    try {
      const res = await vkBridge.send("VKWebAppCallAPIMethod", {
        method: "users.get",
        params: { user_ids: String(sellerId), fields: "photo_100", v: "5.131" }
      });
      const photo = res?.response?.[0]?.photo_100;
      if (photo) { img.src = photo; img.style.display = "block"; }
      else if (img.parentNode) img.parentNode.textContent = (s.name||"П")[0].toUpperCase();

      if (img.parentNode) img.parentNode.textContent = (s.name||"П")[0].toUpperCase();

function expandDesc() {
  const t = document.getElementById("desc-text");
  const m = document.getElementById("desc-more");
  if (t) t.classList.remove("desc-clamp");
  if (m) m.style.display = "none";
  STATE.descExpanded = true;
}

function setSlide(idx) {
  const photos = (STATE.adData||{}).photos||[];
  if (!photos.length) return;
  STATE.curPhoto = ((idx % photos.length) + photos.length) % photos.length;
  const slides = document.getElementById("gallery-slides");
  if (slides) slides.style.transform = `translateX(${-STATE.curPhoto*100}%)`;
  document.querySelectorAll(".gallery-dots span").forEach((d,i)=>
    d.classList.toggle("active", i===STATE.curPhoto));
  const ctr = document.getElementById("gallery-counter");
  if (ctr) ctr.textContent = `${STATE.curPhoto+1} / ${photos.length}`;
}
function gtStart(e) { STATE.touchX0 = e.touches[0].clientX; STATE.touchY0 = e.touches[0].clientY; }
function gtEnd(e) {
  const dx = e.changedTouches[0].clientX - STATE.touchX0;
  const dy = e.changedTouches[0].clientY - STATE.touchY0;
  if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 30)
    dx < 0 ? setSlide(STATE.curPhoto+1) : setSlide(STATE.curPhoto-1);
}
function galleryTap(e) {
  const photos = (STATE.adData||{}).photos||[];
  if (photos.length <= 1) return;
  const rect = e.currentTarget.getBoundingClientRect();
  const x = e.clientX - rect.left;
  x > rect.width/2 ? setSlide(STATE.curPhoto+1) : setSlide(STATE.curPhoto-1);
}

async function toggleFavorite() {
  if (!STATE.vkUserId) { 
    showToast("Войдите в VK"); 
    return; 
  }
  
  haptic("light");
  
  try {
    const data = await apiFetch(`/api/ad/${STATE.adId}/favorite`, { method:"POST" });
    STATE.isFavorite = data.is_favorite;
    
    // Обновляем кнопку
    const btn = document.getElementById("btn-fav");
    if (btn) {
      setFavButton(btn, STATE.isFavorite);
    }

    showToast(STATE.isFavorite ? "Добавлено в избранное" : "Убрано из избранного");
    
    // Сбрасываем кэш и сразу обновляем список
    STATE.favsData = null;
    updateFavBadge();

    // Если сейчас открыта вкладка Избранное — обновляем её
    if (STATE.activeTab === "favs") {
      loadFavs();
    }

  } catch(e) {
    console.error(e);
    showToast("Ошибка. Попробуйте ещё раз.");
  }
}

function updateFavBadge() {
  const badge = document.getElementById("tab-badge");
  if (!badge) return;
  const cnt = (STATE.favsData || []).length;
  if (cnt > 0) {
    badge.textContent = cnt > 9 ? "9+" : cnt;
    badge.classList.add("show");
  } else {
    badge.classList.remove("show");
  }
  const sep = document.querySelector(".fav-sep");
  if (sep && cnt > 0) sep.textContent = `Сохранённые · ${cnt}`;
}

async function loadFavs() {
  if (STATE.favsLoading) return;
  STATE.favsLoading = true;
  try {
    const data = await apiFetch("/api/favorites");
    STATE.favsData = data.items || [];
    renderFavs(STATE.favsData);
  } catch(e) {
    document.getElementById("favs-skeleton").innerHTML = `
      <div class="error-screen">
        <div class="error-icon"><svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9h.01M15 9h.01M8 16c1.1-1 2.4-1.5 4-1.5s2.9.5 4 1.5"/></svg></div>
        <div class="error-title">Не удалось загрузить</div>
        <div class="error-text">Проверьте соединение и попробуйте снова.</div>
      </div>`;
  } finally {
    STATE.favsLoading = false;
  }
}

function renderFavs(items) {
  document.getElementById("favs-skeleton").style.display = "none";
  const wrap = document.getElementById("favs-content");
  wrap.style.display = "";

  if (!items.length) {
    wrap.innerHTML = `
      <div class="fav-empty">
        <div class="fav-empty-icon">${monoIcon("fav","empty-icon")}</div>
        <div class="fav-empty-title">Пока пусто</div>
        <div class="fav-empty-text">Нажмите кнопку избранного в понравившихся объявлениях,<br>и они появятся здесь.</div>
      </div>`;
    return;
  }

  const badge = document.getElementById("tab-badge");
  if (badge && items.length > 0) {
    badge.textContent = items.length > 9 ? "9+" : items.length;
    badge.classList.add("show");
  }

  wrap.innerHTML = `
    <div class="fav-sep">Сохранённые · ${items.length}</div>
    <div class="fav-list" id="fav-list">
      ${items.map(ad => `
        <div class="fav-item" onclick="openAdFromFav(${ad.id})" data-id="${ad.id}">
          <div class="fav-thumb">
            ${ad.photos&&ad.photos[0]
              ? `<img src="${esc(ad.photos[0])}" loading="lazy">`
              : monoIcon("photo","placeholder-icon")}
          </div>
          <div class="fav-info">
            <div class="fav-price">${fmtPrice(ad.price)}</div>
            <div class="fav-title">${esc(ad.title || "Без названия")}</div>
            <div class="fav-city">${esc(ad.city||"")}</div>
          </div>
          <button class="fav-del" onclick="removeFav(event,${ad.id})" title="Убрать">${monoIcon("close")}</button>
        </div>`).join("")}
    </div>`;
}

async function removeFav(e, adId) {
  e.stopPropagation();
  haptic("light");
  try {
    await apiFetch(`/api/ad/${adId}/favorite`, { method:"POST" });
    const item = document.querySelector(`.fav-item[data-id="${adId}"]`);
    if (item) {
      item.style.transition = "opacity .2s,transform .2s";
      item.style.opacity = "0";
      item.style.transform = "translateX(40px)";
      setTimeout(() => {
        item.remove();
        STATE.favsData = (STATE.favsData||[]).filter(a=>a.id!==adId);
        if (!STATE.favsData.length) renderFavs([]);
        updateFavBadge();
      }, 220);
    }
    if (adId === STATE.adId) {
      STATE.isFavorite = false;
      const btn = document.getElementById("btn-fav");
      setFavButton(btn, false);
    }
    showToast("Убрано из избранного");
  } catch(e) {
    showToast("Ошибка. Попробуйте ещё раз.");
  }
}

function openAdFromFav(adId) {
  haptic("light");
  if (adId === STATE.adId) {
    switchTab("ad");
    return;
  }
  STATE.adData = null;
  document.getElementById("ad-skeleton").style.display = "";
  document.getElementById("ad-content").style.display  = "none";
  document.getElementById("ad-error").style.display    = "none";
  switchTab("ad");
  loadAd(adId);
}

function contactSeller() {
  if (!STATE.adData || !STATE.adData.seller || !STATE.adData.seller.id) {
    showToast("Ошибка: продавец не найден");
    return;
  }
  
  haptic("medium");
  const sellerId = STATE.adData.seller.id;
  
  // Правильное открытие личных сообщений
  try {
    vkBridge.send("VKWebAppOpenApp", {
      app_id: 6146827,           // VK Мессенджер
      hash: `im?sel=${sellerId}`
    });
  } catch(e) {
    console.error(e);
  }
  
  // Запасной вариант
  openVKLink(`https://vk.com/im?sel=${sellerId}`);
}

async function shareAd() {
  haptic("light");
  const url = `https://vk.com/app${CFG.VK_APP_ID}#ad_${STATE.adId}`;
  try {
    await vkBridge.send("VKWebAppShare", { link: url });
  } catch(_) {
    try {
      await navigator.clipboard.writeText(url);
      showToast("Ссылка скопирована");
    } catch(_) {
      showToast("Поделитесь ссылкой: " + url);
    }
  }
}

function openVKLink(url) {
  try {
    vkBridge.send("VKWebAppOpenLink", { link: url });
  } catch(_) {
    window.open(url, "_blank");
  }
}

function fmtPrice(p) {
  if (!p) return "Цена не указана";
  if (p === 1) return "Бесплатно";
  return new Intl.NumberFormat("ru-RU").format(p) + " ₽";
}
function fmtNum(n) {
  return new Intl.NumberFormat("ru-RU").format(n||0);
}
function fmtDate(iso) {
  if (!iso) return "";
  try {
    const d = new Date(iso);
    return d.toLocaleDateString("ru-RU", { day:"numeric", month:"long" });
  } catch(_) { return ""; }
}
function esc(s) {
  return String(s||"")
    .replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function stripDot(s) { return String(s||"").replace(/^[·•]\s*/,""); }
function trimTitle(s,n) {
  s = String(s||"");
  return s.length > n ? s.slice(0,n)+"…" : s;
}

let _toastTimer;
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => t.classList.remove("show"), 2500);
}

function getAdIdFromUrl() {
  let hash = window.location.hash.replace("#", "").replace("ad_", "").trim();
  let adId = parseInt(hash);
  if (adId && adId > 0) return adId;

  const params = new URLSearchParams(window.location.search);
  const queryHash = params.get("hash") || "";
  hash = queryHash.replace("ad_", "").trim();
  adId = parseInt(hash);
  if (adId && adId > 0) return adId;

  return 0;
}

async function main() {
  await initVK();

  const adId = getAdIdFromUrl();

  if (adId && adId > 0) {
    await loadAd(adId);
    switchTab("ad");
  } else {
    document.getElementById("ad-skeleton").style.display = "none";
    document.getElementById("ad-error").style.display    = "";
    document.getElementById("ad-error").innerHTML = `
      <div class="error-icon">${monoIcon("tag","empty-icon")}</div>
      <div class="error-title">Полка</div>
      <div class="error-text">Откройте любое объявление из группы,<br>чтобы увидеть его здесь.</div>`;
    
    switchTab("ad");
  }
}

main();
</script>
