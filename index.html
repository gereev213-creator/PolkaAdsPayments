<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
  />

  <title>Полка</title>

  <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, Inter, sans-serif;
    }

    :root {
      --bg: #f2f5f8;
      --card: #ffffff;

      --accent: #4c7eff;
      --accent2: #6ea1ff;

      --text: #121212;
      --sub: #7c8591;

      --border: #e8edf3;

      --shadow:
        0 4px 20px rgba(0,0,0,.05);

      --radius: 22px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
    }

    #app {
      min-height: 100vh;
      padding-bottom: 100px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;

      background: rgba(242,245,248,.82);
      backdrop-filter: blur(16px);

      padding:
        env(safe-area-inset-top)
        18px
        16px
        16px;
    }

    .topbar-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 42px;
      height: 42px;
      object-fit: contain;
    }

    .brand {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -.4px;
    }

    .user-btn {
      width: 42px;
      height: 42px;

      border-radius: 50%;
      background: white;

      display: flex;
      align-items: center;
      justify-content: center;

      box-shadow: var(--shadow);
    }

    .user-btn img {
      width: 22px;
      opacity: .85;
    }

    .search {
      margin-top: 16px;

      background: white;
      border-radius: 18px;

      padding: 14px 16px;

      display: flex;
      align-items: center;
      gap: 10px;

      box-shadow: var(--shadow);
    }

    .search input {
      border: none;
      outline: none;
      width: 100%;
      font-size: 16px;
      background: transparent;
    }

    .categories {
      display: flex;
      gap: 12px;
      overflow-x: auto;

      padding:
        18px
        16px
        8px;
    }

    .categories::-webkit-scrollbar {
      display: none;
    }

    .cat {
      min-width: 92px;

      background: white;
      border-radius: 22px;

      padding: 14px 10px;

      text-align: center;

      box-shadow: var(--shadow);

      transition: .2s;
    }

    .cat.active {
      background: var(--accent);
      color: white;
    }

    .cat img {
      width: 38px;
      height: 38px;
      object-fit: contain;
      margin-bottom: 8px;
    }

    .cat-title {
      font-size: 13px;
      font-weight: 700;
    }

    .feed {
      padding: 8px 16px;
      display: grid;
      gap: 18px;
    }

    .card {
      background: white;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .card-photo {
      position: relative;
      aspect-ratio: 1/1;
      overflow: hidden;
    }

    .card-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .fav {
      position: absolute;
      top: 14px;
      right: 14px;

      width: 42px;
      height: 42px;

      border-radius: 50%;
      background: rgba(255,255,255,.9);

      display: flex;
      align-items: center;
      justify-content: center;

      backdrop-filter: blur(12px);
    }

    .fav span {
      font-size: 20px;
    }

    .card-body {
      padding: 16px;
    }

    .price {
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .title {
      font-size: 17px;
      font-weight: 700;
      line-height: 1.35;

      margin-bottom: 10px;
    }

    .meta {
      display: flex;
      align-items: center;
      justify-content: space-between;

      color: var(--sub);
      font-size: 14px;
    }

    .seller {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .seller img {
      width: 22px;
      opacity: .7;
    }

    .bottom-nav {
      position: fixed;
      left: 16px;
      right: 16px;
      bottom:
        calc(env(safe-area-inset-bottom) + 12px);

      background: rgba(255,255,255,.92);

      border-radius: 28px;

      padding: 12px 10px;

      display: flex;
      justify-content: space-around;

      backdrop-filter: blur(16px);

      box-shadow:
        0 8px 40px rgba(0,0,0,.1);

      z-index: 500;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;

      font-size: 12px;
      font-weight: 700;

      color: #8b97a6;
    }

    .nav-item.active {
      color: var(--accent);
    }

    .nav-icon {
      font-size: 22px;
    }

    .create-btn {
      transform: translateY(-22px);

      width: 64px;
      height: 64px;

      border-radius: 50%;
      background: linear-gradient(
        135deg,
        var(--accent),
        var(--accent2)
      );

      color: white;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 34px;
      font-weight: 300;

      box-shadow:
        0 10px 30px rgba(76,126,255,.35);
    }

    .hero {
      margin: 16px;
      padding: 24px;

      border-radius: 30px;

      background:
        linear-gradient(
          135deg,
          #4c7eff,
          #75a3ff
        );

      color: white;

      position: relative;
      overflow: hidden;
    }

    .hero h2 {
      font-size: 30px;
      line-height: 1.1;
      margin-bottom: 10px;
    }

    .hero p {
      opacity: .92;
      line-height: 1.45;
      max-width: 70%;
    }

    .hero-pattern {
      position: absolute;
      right: -10px;
      bottom: -10px;

      width: 140px;
      opacity: .12;
    }

    .page-title {
      font-size: 22px;
      font-weight: 800;
      padding: 16px;
    }
    
    .empty-feed {
      text-align: center;
      padding: 40px 20px;
      color: var(--sub);
      font-size: 16px;
    }
  </style>
</head>

<body>
  <div id="app"></div>

  <script>
    // Твой живой адрес туннеля ngrok
    const API_URL = 'https://endorphin-trump-cavalier.ngrok-free.dev/api';

    const assets = {
      logo: 'https://i.postimg.cc/5QSkYwbd/polka-logo-2-png.png',
      user: 'https://i.postimg.cc/gLWT2MFG/icons8-user-64.png',
      pattern: 'https://i.postimg.cc/kRvh6x9L/trafaret-papik-pro-tmxp-p-trafareti-solyarnii-znak-udmurtii-1-Photoroom-2.png',
      categories: {
        auto: 'https://i.postimg.cc/sGrNgnFL/icons8-avtomobil-100.png',
        home: 'https://i.postimg.cc/4HgSx8CD/icons8-zdanie-s-terrasoj-na-kryse-100.png',
        furniture: 'https://i.postimg.cc/SYhvxZ0w/icons8-mebel-100.png',
        clothes: 'https://i.postimg.cc/4HgSx8kZ/icons8-futbolka-100.png',
        tech: 'https://i.postimg.cc/xN241sDQ/icons8-printer-100.png',
        work: 'https://i.postimg.cc/xN241sD2/icons8-rabota-100.png',
      },
    };

    const state = {
      activeCategory: 'all',
      ads: [], // Сюда будут прилетать реальные товары с сервера
      isLoading: true
    };

    const categories = [
      { id: 'all', title: 'Все', icon: assets.logo },
      { id: 'auto', title: 'Авто', icon: assets.categories.auto },
      { id: 'tech', title: 'Техника', icon: assets.categories.tech },
      { id: 'home', title: 'Жильё', icon: assets.categories.home },
      { id: 'furniture', title: 'Мебель', icon: assets.categories.furniture },
      { id: 'clothes', title: 'Одежда', icon: assets.categories.clothes },
      { id: 'work', title: 'Работа', icon: assets.categories.work },
    ];

    async function initVK() {
      try {
        await vkBridge.send('VKWebAppInit');
      } catch (e) {
        console.log("VK Bridge Init Error:", e);
      }
    }

    // 🌟 Функция асинхронной загрузки объявлений с сервера
    async function loadAds() {
      try {
        state.isLoading = true;
        render();
        
        const response = await fetch(`${API_URL}/ads`);
        if (!response.ok) throw new Error('Ошибка сети');
        
        state.ads = await response.json();
      } catch (e) {
        console.error("Не удалось загрузить объявления с сервера:", e);
        state.ads = [];
      } finally {
        state.isLoading = false;
        render();
      }
    }

    function render() {
      const app = document.getElementById('app');

      // Фильтруем товары по выбранной категории на фронтенде
      const filteredAds = state.activeCategory === 'all'
        ? state.ads
        : state.ads.filter(ad => ad.category === state.activeCategory);

      // Генерируем HTML для ленты объявлений
      let feedHtml = '';
      if (state.isLoading) {
        feedHtml = `<div class="empty-feed">🔄 Загрузка объявлений с Полки...</div>`;
      } else if (filteredAds.length === 0) {
        feedHtml = `<div class="empty-feed">📦 Тут пока пусто. Станьте первым, кто добавит товар в этой категории через бота!</div>`;
      } else {
        feedHtml = filteredAds.map(ad => `
          <div class="card">
            <div class="card-photo">
              <img src="${ad.photo}" />
              <div class="fav"><span>♡</span></div>
            </div>

            <div class="card-body">
              <div class="price">
                ${Number(ad.price).toLocaleString('ru-RU')} ₽
              </div>

              <div class="title">
                ${ad.title}
              </div>

              <div class="meta">
                <div>📍 ${ad.city || 'Удмуртия'}</div>
                <div class="seller">
                  <img src="${assets.user}" />
                  ${ad.seller}
                </div>
              </div>
            </div>
          </div>
        `).join('');
      }

      app.innerHTML = `
        <div class="topbar">
          <div class="topbar-row">
            <div class="logo-wrap">
              <img class="logo" src="${assets.logo}" />
              <div class="brand">Полка</div>
            </div>

            <div class="user-btn">
              <img src="${assets.user}" />
            </div>
          </div>

          <div class="search">
            🔍
            <input placeholder="Поиск объявлений..." />
          </div>
        </div>

        <div class="hero">
          <h2>Маркетплейс<br />Удмуртии</h2>
          <p>Покупай, продавай и находи всё рядом.</p>
          <img class="hero-pattern" src="${assets.pattern}" />
        </div>

        <div class="categories">
          ${categories.map(cat => `
            <div
              class="cat ${state.activeCategory === cat.id ? 'active' : ''}"
              onclick="selectCategory('${cat.id}')"
            >
              <img src="${cat.icon}" />
              <div class="cat-title">${cat.title}</div>
            </div>
          `).join('')}
        </div>

        <div class="page-title">Рекомендации</div>

        <div class="feed">
          ${feedHtml}
        </div>

        <div class="bottom-nav">
          <div class="nav-item active">
            <div class="nav-icon">🏠</div>Главная
          </div>
          <div class="nav-item">
            <div class="nav-icon">♡</div>Избранное
          </div>
          <div class="create-btn">+</div>
          <div class="nav-item">
            <div class="nav-icon">💬</div>Чаты
          </div>
          <div class="nav-item">
            <div class="nav-icon">👤</div>Профиль
          </div>
        </div>
      `;
    }

    function selectCategory(id) {
      state.activeCategory = id;
      render();
    }

    // Запуск процессов
    initVK();
    render();
    loadAds(); // Запрашиваем данные с сервера сразу при открытии
  </script>
</body>
</html>
