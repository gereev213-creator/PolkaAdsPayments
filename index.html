<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Полка</title>
<script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
<style>
/* ── VK Human Interface tokens ─────────────────────────────────────────── */
:root {
  --c-bg:           #f2f3f5;
  --c-card:         #ffffff;
  --c-divider:      rgba(0,0,0,.12);
  --c-text-primary: #000000;
  --c-text-second:  #818c99;
  --c-accent:       #3f8ae0;
  --c-accent-2:     #2a5885;
  --c-red:          #e64646;
  --c-green:        #4bb34b;
  --c-orange:       #ffa000;
  --c-pill-bg: #f0f2f5;
  --c-skeleton:     #e8eaf0;
  --radius-card:    12px;
  --radius-btn:     10px;
  --safe-t: env(safe-area-inset-top,    0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left,   0px);
  --safe-r: env(safe-area-inset-right,  0px);
  --bar-h:  calc(56px + var(--safe-t));
  --tab-h:  calc(52px + var(--safe-b));
  --font:   -apple-system,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
}
[data-theme="dark"] {
  --c-bg:           #19191a;
  --c-card:         #232324;
  --c-divider:      rgba(255,255,255,.12);
  --c-text-primary: #e1e3e6;
  --c-text-second:  #76787a;
  --c-pill-bg:      #2c2d2e;
  --c-skeleton:     #2c2d2e;
}

/* ── Reset ──────────────────────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{
  font-family:var(--font);
  font-size:15px;
  line-height:1.4;
  color:var(--c-text-primary);
  background:var(--c-bg);
  -webkit-tap-highlight-color:transparent;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;outline:none}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}

/* ── Layout ─────────────────────────────────────────────────────────────── */
#app{
  position:fixed;inset:0;
  display:flex;
  flex-direction:column;
  background:var(--c-bg);
}

/* ── Header ─────────────────────────────────────────────────────────────── */
#header{
  flex-shrink:0;
  height: var(--bar-h);
  display:flex;align-items:center;
  padding:0 16px;
  padding-top:var(--safe-t);
  background:var(--c-card);
  border-bottom:1px solid var(--c-divider);
  position:relative;
  z-index:10;
}
.header-back{
  display:none;align-items:center;gap:4px;
  color:var(--c-accent);font-size:17px;font-weight:400;
  padding:8px 8px 8px 0;margin-right:4px;
  transition:opacity .15s;
  position: relative;
  z-index: 2;
}
.header-back svg{width:11px;height:18px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round}
.header-back.visible{display:flex}
.header-back:active{opacity:.5}
#header-title{
  position: absolute;
  left: 50%;
  top: var(--safe-t);
  bottom: 0;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1;
}
.header-right{
  display:flex;align-items:center;
  min-width:60px;justify-content:flex-end;
  position: relative;
  z-index: 2;
  margin-left: auto;
}
.header-share-btn{
  color:var(--c-accent);
  font-size:15px;font-weight:400;
  padding:8px 0 8px 8px;
  display:none;
}
.header-share-btn:active{opacity:.5}
.header-share-btn.visible{display:block}

/* ── Tabs (Нижняя навигация) ────────────────────────────────────────────── */
#tabs{
  flex-shrink:0;
  height: var(--tab-h);
  display:grid;grid-template-columns:1fr 1fr 1fr 1fr;
  background:var(--c-card);
  border-top:1px solid var(--c-divider);
  z-index:10;
}
.tab-btn{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;padding-bottom:var(--safe-b);
  color:var(--c-text-second);
  font-size:9px;font-weight:500;
  transition:color .15s;
  position:relative;
}
.tab-btn svg{width:22px;height:22px}
.tab-btn.active{color:var(--c-accent)}
.tab-btn:active{opacity:.6}
.tab-badge{
  position:absolute;top:6px;right:calc(50% - 20px);
  background:var(--c-red);color:#fff;
  font-size:9px;font-weight:700;line-height:1;
  padding:2px 4px;border-radius:10px;
  min-width:14px;text-align:center;
  display:none;
}
.tab-badge.show{display:block}

/* Карточки поиска/похожих */
.ad-card{
  background:var(--c-card);
  display:flex;gap:10px;align-items:center;
  padding:10px 12px;margin:0 0 1px;
  cursor:pointer;transition:background .15s;
}
.ad-card:active{background:var(--c-pill-bg)}
.ad-card-thumb{
  width:56px;height:56px;border-radius:8px;flex-shrink:0;
  background:var(--c-skeleton);overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  font-size:22px;color:var(--c-text-second);
}
.ad-card-thumb img{width:100%;height:100%;object-fit:cover}
.ad-card-info{flex:1;min-width:0}
.ad-card-price{font-size:15px;font-weight:700}
.ad-card-title{font-size:13px;color:var(--c-text-second);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.ad-card-meta{font-size:12px;color:var(--c-text-second);margin-top:2px}

/* Статистика */
.stat-card{background:var(--c-card);border-radius:12px;padding:14px 16px;margin:8px 12px 0}
.stat-row{display:flex;justify-content:space-between;align-items:center;
  padding:10px 0;border-bottom:1px solid var(--c-divider)}
.stat-row:last-child{border-bottom:none;padding-bottom:0}
.stat-label{font-size:14px;color:var(--c-text-second)}
.stat-val{font-size:15px;font-weight:600}
.stat-num{display:flex;gap:16px;justify-content:space-around}
.stat-num span{display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:20px;font-weight:700}
.stat-num small{font-size:11px;font-weight:400;color:var(--c-text-second)}

/* ── View container ─────────────────────────────────────────────────────── */
#views{
  flex:1;
  position:relative;
  overflow:hidden;
  background:var(--c-bg);
}
.view{
  position:absolute;inset:0;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  background:var(--c-bg);
}
/* Полное скрытие неактивных экранов для избежания артефактов на десктопе */
.view.hidden{
  display:none !important;
}

/* ── Skeleton ────────────────────────────────────────────────────────────── */
@keyframes shimmer{
  from{background-position:200% 0}
  to{background-position:-200% 0}
}
.sk{
  background:linear-gradient(90deg,var(--c-skeleton) 25%,
    color-mix(in srgb,var(--c-skeleton) 60%,var(--c-card)) 50%,
    var(--c-skeleton) 75%);
  background-size:200% 100%;
  animation:shimmer 1.4s infinite;
  border-radius:8px;
}

/* ── Gallery ─────────────────────────────────────────────────────────────── */
.gallery{
  position:relative;
  width:100%;
  aspect-ratio:4/3;
  background:var(--c-skeleton);
  overflow:hidden;
  cursor:pointer;
}
.gallery-slides{
  display:flex;
  height:100%;
  transition:transform .3s cubic-bezier(.4,0,.2,1);
  will-change:transform;
}
.gallery-slide{
  min-width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
  background:var(--c-skeleton);
}
.gallery-slide img{
  width:100%;height:100%;
  object-fit:cover;
}
.gallery-dots{
  position:absolute;bottom:10px;left:50%;transform:translateX(-50%);
  display:flex;gap:5px;
}
.gallery-dots span{
  width:6px;height:6px;border-radius:50%;
  background:rgba(255,255,255,.5);
  transition:background .2s,width .2s;
}
.gallery-dots span.active{background:#fff;width:14px;border-radius:3px}
.gallery-counter{
  position:absolute;bottom:10px;right:14px;
  background:rgba(0,0,0,.45);color:#fff;
  font-size:12px;font-weight:600;
  padding:3px 8px;border-radius:20px;
  display:none;
}
.gallery-no-photo{
  width:100%;aspect-ratio:4/3;
  display:flex;align-items:center;justify-content:center;
  background:var(--c-pill-bg);
  font-size:56px;color:var(--c-text-second);
}

/* ── Cards ───────────────────────────────────────────────────────────────── */
.card{
  background:var(--c-card);
  margin:0 0 8px;
  padding:14px 16px;
}
.card:first-child{border-radius:0 0 var(--radius-card) var(--radius-card)}
.card+.card{border-radius:var(--radius-card)}
.card-last{margin-bottom:16px}

/* ── Price + title ───────────────────────────────────────────────────────── */
.price{
  font-size:28px;font-weight:700;
  line-height:1.2;margin-bottom:4px;
}
.ad-title{
  font-size:18px;font-weight:600;
  line-height:1.3;margin-bottom:10px;
}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:2px}
.pill{
  background:var(--c-pill-bg);
  padding:4px 10px;border-radius:20px;
  font-size:13px;color:var(--c-text-second);
}
.pill.green{background:#ebf8eb;color:var(--c-green)}
.pill.orange{background:#fff3e0;color:var(--orange)}

/* ── Seller ──────────────────────────────────────────────────────────────── */
.seller-row{display:flex;align-items:center;gap:12px}
.seller-ava{
  width:42px;height:42px;border-radius:50%;flex-shrink:0;
  background:var(--c-accent-2);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:700;
  overflow:hidden;
}
.seller-ava img{width:100%;height:100%;object-fit:cover}
.seller-name{font-size:15px;font-weight:600}
.seller-sub{font-size:13px;color:var(--c-text-second);margin-top:1px}
.verified-badge{display:inline-block;margin-left:4px;vertical-align:middle;font-size:14px}

/* ── Meta rows ───────────────────────────────────────────────────────────── */
.meta-row{
  display:flex;align-items:flex-start;gap:8px;
  padding:10px 0;border-bottom:1px solid var(--c-divider);
  font-size:15px;
}
.meta-row:last-child{border-bottom:none;padding-bottom:0}
.meta-row:first-child{padding-top:0}
.meta-key{color:var(--c-text-second);flex:0 0 100px}
.meta-val{flex:1;color:var(--c-text-primary)}

/* ── Description ────────────────────────────────────────────────────────── */
.desc{
  font-size:15px;line-height:1.6;
  color:var(--c-text-primary);
  white-space:pre-wrap;
  word-break:break-word;
}
.desc-clamp{
  -webkit-line-clamp:5;
  -webkit-box-orient:vertical;
  display:-webkit-box;
  overflow:hidden;
}
.desc-more{
  display:none;
  color:var(--c-accent);font-size:14px;
  margin-top:6px;cursor:pointer;
}
.desc-more.show{display:block}

/* ── Action bar (bottom floating) ──────────────────────────────────────── */
.action-bar{
  position:sticky;bottom:0;
  background:var(--c-card);
  padding:8px 12px calc(8px + var(--safe-b));
  border-top:1px solid var(--c-divider);
  display:flex;gap:8px;
  z-index:5;
}
.btn{
  height:48px;border-radius:var(--radius-btn);
  font-size:16px;font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:6px;
  transition:opacity .12s,transform .1s;
  user-select:none;
  -webkit-user-select:none;
}
.btn-primary{flex:1;background:var(--c-accent);color:#fff}
.btn-fav{
  flex:0 0 52px;
  background:var(--c-pill-bg);
  color:var(--c-red);
  font-size:22px;
  transition:background .2s,color .2s,opacity .12s,transform .1s;
}
.btn-fav.is-fav{background:var(--c-red);color:#fff}

/* ── Favourites list ─────────────────────────────────────────────────────── */
.fav-list{padding:8px 0 16px}
.fav-item{
  background:var(--c-card);
  display:flex;align-items:center;gap:12px;
  padding:12px 16px;
  margin:0 0 1px;
  cursor:pointer;
  transition:background .15s;
  position:relative;
}
.fav-item:first-child{border-radius:var(--radius-card) var(--radius-card) 0 0}
.fav-item:last-child{border-radius:0 0 var(--radius-card) var(--radius-card);margin-bottom:0}
.fav-item:only-child{border-radius:var(--radius-card)}
.fav-item:active{background:var(--c-pill-bg)}
.fav-thumb{
  width:64px;height:64px;border-radius:8px;flex-shrink:0;
  background:var(--c-skeleton);overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  font-size:26px;color:var(--c-text-second);
}
.fav-thumb img{width:100%;height:100%;object-fit:cover}
.fav-info{flex:1;min-width:0}
.fav-price{font-size:17px;font-weight:700;margin-bottom:2px}
.fav-title{font-size:14px;color:var(--c-text-second);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fav-city{font-size:12px;color:var(--c-text-second);margin-top:2px}
.fav-del{
  color:var(--c-text-second);font-size:20px;
  padding:8px;margin:-8px;flex-shrink:0;
  transition:color .15s;
}
.fav-del:active{color:var(--c-red)}

.fav-sep{
  padding:14px 16px 6px;
  font-size:13px;font-weight:600;
  color:var(--c-text-second);
  text-transform:uppercase;letter-spacing:.5px;
}
.fav-empty{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:80px 32px;text-align:center;gap:12px;
}
.fav-empty-icon{font-size:64px;line-height:1}
.fav-empty-title{font-size:20px;font-weight:700}
.fav-empty-text{font-size:15px;color:var(--c-text-second);line-height:1.5}

/* ── Error / 404 ────────────────────────────────────────────────────────── */
.error-screen{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:50vh;padding:40px;text-align:center;gap:10px;
}
.error-icon{font-size:64px}
.error-title{font-size:22px;font-weight:700}
.error-text{font-size:15px;color:var(--c-text-second);line-height:1.5}

/* ── Toast ───────────────────────────────────────────────────────────────── */
#toast{
  position:fixed;bottom:calc(var(--tab-h) + 12px);left:50%;
  transform:translateX(-50%) translateY(20px);
  background:rgba(0,0,0,.8);color:#fff;
  padding:10px 18px;border-radius:24px;
  font-size:14px;pointer-events:none;opacity:0;
  transition:opacity .2s,transform .2s;
  z-index:1000;
  max-width:calc(100vw - 32px);
  white-space:normal;text-align:center;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── Misc ────────────────────────────────────────────────────────────────── */
.divider{border:none;border-top:1px solid var(--c-divider);margin:0}
.stats-row{
  display:flex;gap:16px;font-size:13px;color:var(--c-text-second);
  margin-top:6px;
}
.stats-row span{display:flex;align-items:center;gap:4px}
.spinner{
  display:flex;align-items:center;justify-content:center;
  padding:40px;
}
.spin{
  width:28px;height:28px;border-radius:50%;
  border:3px solid var(--c-divider);
  border-top-color:var(--c-accent);
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* Анимация сканирования фото */
@keyframes scan-laser {
  0% { top: 0%; }
  50% { top: 100%; }
  100% { top: 0%; }
}
</style>
</head>
<body>
<div id="app">

  <!-- ══ HEADER ══ -->
  <div id="header">
    <button class="header-back" id="btn-back" onclick="navigateBack()">
      <svg viewBox="0 0 11 18"><polyline points="10,1 1,9 10,17"/></svg>
      Назад
    </button>
    <div id="header-title">
      <img src="https://i.postimg.cc/FzJSMZz1/polka-logo-2-png.png" alt="Полка" style="height:15px;object-fit:contain;image-rendering:auto">
    </div>
    <div class="header-right">
      <button class="header-share-btn" id="btn-share" onclick="shareAd()">Поделиться</button>
    </div>
  </div>

  <!-- ══ VIEWS ══ -->
  <div id="views">

    <!-- Вид: карточка объявления -->
    <div class="view" id="view-ad">
      <div id="ad-skeleton">
        <div class="sk" style="width:100%;aspect-ratio:4/3;border-radius:0"></div>
        <div class="card" style="margin-top:8px">
          <div class="sk" style="height:32px;width:40%;margin-bottom:8px"></div>
          <div class="sk" style="height:22px;width:75%;margin-bottom:12px"></div>
          <div style="display:flex;gap:8px">
            <div class="sk" style="height:26px;width:80px;border-radius:20px"></div>
            <div class="sk" style="height:26px;width:60px;border-radius:20px"></div>
          </div>
        </div>
        <div class="card">
          <div style="display:flex;gap:12px;align-items:center">
            <div class="sk" style="width:42px;height:42px;border-radius:50%;flex-shrink:0"></div>
            <div style="flex:1">
              <div class="sk" style="height:16px;width:55%;margin-bottom:6px"></div>
              <div class="sk" style="height:13px;width:40%"></div>
            </div>
          </div>
        </div>
      </div>
      <div id="ad-content" style="display:none"></div>
      <div id="ad-error"   style="display:none" class="error-screen">
        <div class="error-icon">📭</div>
        <div class="error-title">Объявление не найдено</div>
        <div class="error-text">Возможно, оно снято с публикации.</div>
      </div>
    </div>

    <!-- Вид: мои избранные -->
    <div class="view hidden" id="view-favs">
      <div id="favs-skeleton" class="fav-list">
        <div class="fav-sep">Загружаем…</div>
        <div class="spinner"><div class="spin"></div></div>
      </div>
      <div id="favs-content" style="display:none"></div>
    </div>

    <!-- Вид: поиск -->
    <div class="view hidden" id="view-search">
      <div style="padding:12px 12px 0">
        <div style="display:flex;gap:8px;margin-bottom:8px">
          <div style="position:relative;flex:1">
            <input id="search-input" type="search" placeholder="Поиск объявлений…"
              style="width:100%;height:40px;border-radius:10px;border:1.5px solid var(--c-divider);
                     padding:0 40px 0 12px;font-size:15px;background:var(--c-card);color:var(--c-text-primary);outline:none"
              oninput="onSearchInput()" onkeydown="if(event.key==='Enter')doSearch()">
            <label for="photo-search-input" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);cursor:pointer;padding:4px;display:flex;align-items:center;color:var(--c-text-second)">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                <circle cx="12" cy="13" r="4"/>
              </svg>
            </label>
            <input id="photo-search-input" type="file" accept="image/*" style="display:none" onchange="doPhotoSearch(event)">
          </div>
          <button onclick="doSearch()" style="height:40px;padding:0 14px;background:var(--c-accent);
            color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer">
            Найти
          </button>
        </div>
        <div id="filter-chips" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px"></div>
        <div id="filter-panel" style="display:none;background:var(--c-card);border-radius:12px;padding:12px;margin-bottom:8px">
          <div style="display:flex;gap:8px;margin-bottom:8px">
            <select id="f-city" style="flex:1;height:36px;border-radius:8px;border:1px solid var(--c-divider);
              padding:0 8px;font-size:14px;background:var(--c-card);color:var(--c-text-primary)">
              <option value="">Все города</option>
            </select>
            <select id="f-cat" style="flex:1;height:36px;border-radius:8px;border:1px solid var(--c-divider);
              padding:0 8px;font-size:14px;background:var(--c-card);color:var(--c-text-primary)">
              <option value="">Все категории</option>
            </select>
          </div>
          <div style="display:flex;gap:8px;align-items:center">
            <input id="f-min" type="number" placeholder="Цена от" style="flex:1;height:36px;border-radius:8px;
              border:1px solid var(--c-divider);padding:0 8px;font-size:14px;background:var(--c-card);color:var(--c-text-primary)">
            <span style="color:var(--c-text-second)">—</span>
            <input id="f-max" type="number" placeholder="до" style="flex:1;height:36px;border-radius:8px;
              border:1px solid var(--c-divider);padding:0 8px;font-size:14px;background:var(--c-card);color:var(--c-text-primary)">
            <button onclick="doSearch()" style="height:36px;padding:0 12px;background:var(--c-accent);
              color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer">
              ОК
            </button>
          </div>
        </div>
        <button onclick="toggleFilters()" style="background:none;border:none;color:var(--c-accent);
          font-size:13px;cursor:pointer;padding:0;margin-bottom:4px">
          ⚙️ Фильтры
        </button>
      </div>
      <div id="search-results"></div>
    </div>

    <!-- Вид: моя статистика -->
    <div class="view hidden" id="view-stats">
      <div id="stats-skeleton" style="padding:16px">
        <div class="spinner"><div class="spin"></div></div>
      </div>
      <div id="stats-content" style="display:none"></div>
    </div>

  </div>

  <!-- ══ TABS ══ -->
  <div id="tabs">
    <button class="tab-btn" id="tab-ad" onclick="switchTab('ad')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="3"/>
        <path d="M3 9h18M9 21V9"/>
      </svg>
      Объявление
    </button>
    <button class="tab-btn active" id="tab-search" onclick="switchTab('search')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      Поиск
    </button>
    <button class="tab-btn" id="tab-favs" onclick="switchTab('favs')">
      <div class="tab-badge" id="tab-badge">0</div>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 1 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78z"/>
      </svg>
      Избранное
    </button>
    <button class="tab-btn" id="tab-stats" onclick="switchTab('stats')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/>
        <line x1="6" y1="20" x2="6" y2="14"/>
      </svg>
      Мои
    </button>
  </div>

</div>

<!-- Модальное окно сканирования фото -->
<div id="scan-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:2000;flex-direction:column;align-items:center;justify-content:center;color:#fff;padding:20px">
  <div style="position:relative;width:240px;aspect-ratio:1;border-radius:16px;overflow:hidden;background:#222;box-shadow:0 0 25px rgba(63,138,224,0.5);margin-bottom:24px">
    <img id="scan-preview" style="width:100%;height:100%;object-fit:cover" src="">
    <div style="position:absolute;left:0;right:0;height:4px;background:linear-gradient(to bottom, transparent, var(--c-accent), #fff, var(--c-accent), transparent);box-shadow:0 0 12px var(--c-accent);animation:scan-laser 2s ease-in-out infinite"></div>
  </div>
  <div style="font-size:18px;font-weight:700;margin-bottom:8px">Анализ изображения...</div>
  <div style="font-size:14px;color:rgba(255,255,255,0.6);text-align:center">Ищем похожие товары на Полке</div>
</div>

<!-- Toast -->
<div id="toast"></div>

<script>
const CFG = {
  API_BASE:   "https://polka-api.onrender.com",
  BOT_GROUP:  "238149306",              // ID группы (без минуса)
  VK_APP_ID:  54623990,
};

const STATE = {
  vkUserId:     0,
  vkUserPhoto:  "",
  launchParams: "",
  adData:       null,
  adId:         0,
  isFavorite:   false,
  favsData:     null,       // null = не загружены
  favsLoading:  false,
  curPhoto:     0,
  touchX0:      0,
  touchY0:      0,
  activeTab:    "",         // Пустая строка при инициализации позволяет switchTab() сработать корректно на старте
  descExpanded: false,
  filtersLoaded: false,
  initialSearchDone: false,
};

async function initVK() {
  try { await vkBridge.send("VKWebAppInit"); } catch(_) {}

  // Определение темы оформления
  try {
    const cfg = await vkBridge.send("VKWebAppGetConfig");
    if (cfg.appearance === "dark")
      document.documentElement.setAttribute("data-theme","dark");
  } catch(_) {}

  // Извлекаем vk_user_id напрямую из launch params как самый надёжный фоллбек
  const params = new URLSearchParams(window.location.search);
  const paramUid = parseInt(params.get("vk_user_id"));
  if (paramUid) {
    STATE.vkUserId = paramUid;
  }

  // Запрашиваем информацию о пользователе
  try {
    const u = await vkBridge.send("VKWebAppGetUserInfo");
    if (u && u.id) {
      STATE.vkUserId    = u.id;
      STATE.vkUserPhoto = u.photo_100 || "";
    }
  } catch(_) {}

  STATE.launchParams = window.location.search.slice(1);

  // Подключение свайпов возврата в мобильных клиентах VK
  try { await vkBridge.send("VKWebAppSetSwipeSettings", { history: true }); } catch(_) {}
  try { await vkBridge.send("VKWebAppEnableSwipeBack"); } catch(_) {}
}

async function haptic(style="light") {
  try { await vkBridge.send("VKWebAppTapticImpactOccurred", { style }); } catch(_) {}
}

async function apiFetch(path, opts={}) {
  const headers = {
    "X-VK-Sign":                STATE.launchParams,
    "X-VK-User-Id":             String(STATE.vkUserId),
    "Content-Type":             "application/json",
    "ngrok-skip-browser-warning": "true",
    ...(opts.headers||{}),
  };
  const res = await fetch(CFG.API_BASE + path, { ...opts, headers });
  if (!res.ok) throw Object.assign(new Error("API error"), { status: res.status });
  return res.json();
}

function switchTab(tab) {
  // Убран early return STATE.activeTab === tab, чтобы вкладка ВСЕГДА гарантированно обновлялась при рендере!
  STATE.activeTab = tab;
  
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
  const currentTabBtn = document.getElementById(`tab-${tab}`);
  if (currentTabBtn) currentTabBtn.classList.add("active");
  
  ["ad","favs","search","stats"].forEach(v => {
    const el = document.getElementById(`view-${v}`);
    if (el) el.classList.toggle("hidden", v !== tab);
  });
  
  if (tab === "favs") {
    setHeader(false, false);
    if (!STATE.favsData) loadFavs();
  } else if (tab === "search") {
    setHeader(false, false);
    if (!STATE.filtersLoaded) loadFilters();
    if (!STATE.initialSearchDone) {
      doSearch();
      STATE.initialSearchDone = true;
    }
  } else if (tab === "stats") {
    setHeader(false, false);
    loadStats(); // Загружаем статистику заново для обновления просмотров
  } else {
    setHeader(false, !!STATE.adData);
  }
}

let _searchTimer = null;
function onSearchInput() {
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(doSearch, 500);
}

async function doPhotoSearch(e) {
  const file = e.target.files?.[0];
  if (!file) return;
  haptic("medium");

  const overlay = document.getElementById("scan-overlay");
  const preview = document.getElementById("scan-preview");
  if (overlay && preview) {
    preview.src = URL.createObjectURL(file);
    overlay.style.display = "flex";
  }

  const fd = new FormData();
  fd.append("photo", file);

  try {
    const res = await fetch(CFG.API_BASE + "/api/search-by-photo", {
      method: "POST",
      headers: {
        "X-VK-Sign": STATE.launchParams,
        "X-VK-User-Id": String(STATE.vkUserId),
        "ngrok-skip-browser-warning": "true"
      },
      body: fd
    });

    if (!res.ok) throw new Error("API error");
    const data = await res.json();

    if (overlay) overlay.style.display = "none";

    const wrap = document.getElementById("search-results");
    renderAdList(wrap, data.items, data.total, "Найдено по фото");
    
    e.target.value = "";
  } catch(err) {
    if (overlay) overlay.style.display = "none";
    showToast("Не удалось распознать фото");
  }
}

function toggleFilters() {
  const p = document.getElementById("filter-panel");
  p.style.display = p.style.display === "none" ? "" : "none";
}

async function loadFilters() {
  try {
    const data = await apiFetch("/api/filters");
    const cityEl = document.getElementById("f-city");
    const catEl  = document.getElementById("f-cat");
    
    cityEl.innerHTML = '<option value="">Все города</option>';
    catEl.innerHTML = '<option value="">Все категории</option>';

    (data.cities||[]).forEach(c => {
      cityEl.innerHTML += `<option value="${esc(c)}">${esc(c)}</option>`;
    });
    (data.categories||[]).forEach(c => {
      catEl.innerHTML += `<option value="${esc(c)}">${esc(c)}</option>`;
    });
    STATE.filtersLoaded = true;
  } catch(_) {}
}

async function doSearch() {
  const q    = document.getElementById("search-input")?.value.trim() || "";
  const city = document.getElementById("f-city")?.value || "";
  const cat  = document.getElementById("f-cat")?.value || "";
  const minP = document.getElementById("f-min")?.value || "";
  const maxP = document.getElementById("f-max")?.value || "";

  const wrap = document.getElementById("search-results");
  wrap.innerHTML = `<div class="spinner" style="padding:32px"><div class="spin"></div></div>`;

  const chips = [];
  if (city) chips.push(`<span class="pill" onclick="clearFilter('city')" style="cursor:pointer">${esc(city)} ✕</span>`);
  if (cat)  chips.push(`<span class="pill" onclick="clearFilter('cat')"  style="cursor:pointer">${esc(cat)} ✕</span>`);
  if (minP||maxP) chips.push(`<span class="pill" onclick="clearFilter('price')" style="cursor:pointer">${minP||'0'} — ${maxP||'∞'} ₽ ✕</span>`);
  document.getElementById("filter-chips").innerHTML = chips.join("");

  try {
    const params = new URLSearchParams();
    if (q)    params.set("q", q);
    if (city) params.set("city", city);
    if (cat)  params.set("category", cat);
    if (minP) params.set("min_price", minP);
    if (maxP) params.set("max_price", maxP);
    const data = await apiFetch(`/api/search?${params}`);
    renderAdList(wrap, data.items, data.total, q||"объявления");
  } catch(_) {
    wrap.innerHTML = `<div class="error-screen"><div class="error-icon">😕</div><div class="error-title">Ошибка загрузки</div></div>`;
  }
}

function clearFilter(type) {
  if (type==="city")  document.getElementById("f-city").value = "";
  if (type==="cat")   document.getElementById("f-cat").value = "";
  if (type==="price") { document.getElementById("f-min").value=""; document.getElementById("f-max").value=""; }
  doSearch();
}

function renderAdList(wrap, items, total, label) {
  if (!items || !items.length) {
    wrap.innerHTML = `<div class="fav-empty"><div class="fav-empty-icon">🔍</div>
      <div class="fav-empty-title">Ничего не найдено</div>
      <div class="fav-empty-text">Попробуйте изменить запрос или фильтры</div></div>`;
    return;
  }
  wrap.innerHTML = `
    <div class="fav-sep">${esc(label)} · ${total}</div>
    ${items.map(ad => adCardHtml(ad)).join("")}`;
}

function adCardHtml(ad) {
  const photos = ad.photos || [];
  const thumb = photos[0]
    ? `<img src="${esc(photos[0])}" loading="lazy">`
    : "📷";
  const categoryStr = ad.category ? " · " + esc(ad.category.replace(/^·\s*/,"")) : "";
  return `<div class="ad-card" onclick="openAdFromFav(${ad.id})">
    <div class="ad-card-thumb">${thumb}</div>
    <div class="ad-card-info">
      <div class="ad-card-price">${fmtPrice(ad.price)}</div>
      <div class="ad-card-title">${esc(ad.title || "Без названия")}</div>
      <div class="ad-card-meta">${esc(ad.city||"")}${categoryStr}</div>
    </div>
  </div>`;
}

async function loadStats() {
  try {
    const data = await apiFetch("/api/my/stats");
    STATE.statsLoaded = true;
    renderStats(data.items || []);
  } catch(e) {
    document.getElementById("stats-skeleton").innerHTML =
      `<div class="error-screen"><div class="error-icon">😕</div><div class="error-title">Не удалось загрузить</div></div>`;
  }
}

function renderStats(items) {
  document.getElementById("stats-skeleton").style.display = "none";
  const wrap = document.getElementById("stats-content");
  wrap.style.display = "";

  if (!items.length) {
    wrap.innerHTML = `<div class="fav-empty">
      <div class="fav-empty-icon">📊</div>
      <div class="fav-empty-title">Нет объявлений</div>
      <div class="fav-empty-text">Разместите первое объявление через бота</div></div>`;
    return;
  }

  const totalViews = items.reduce((s,a) => s + (a.views||0), 0);
  const totalFavs  = items.reduce((s,a) => s + (a.fav_count||0), 0);
  const active     = items.filter(a => a.status==="active").length;

  const maxViews = Math.max(1, ...items.map(a => a.views||0));
  const maxFavs  = Math.max(1, ...items.map(a => a.fav_count||0));

  wrap.innerHTML = `
    <div class="stat-card" style="margin-top:12px">
      <div class="stat-num">
        <span>${active}<small>активных</small></span>
        <span>${fmtNum(totalViews)}<small>просмотров</small></span>
        <span>${fmtNum(totalFavs)}<small>в избранном</small></span>
      </div>
    </div>
    <div style="padding:12px 12px 4px;font-size:13px;font-weight:600;color:var(--c-text-second);text-transform:uppercase;letter-spacing:.5px">
      Мои объявления
    </div>
    ${items.map((ad,idx) => {
      const safeTitle = ad.title ? ad.title : (ad.description ? trimTitle(ad.description, 35) : "Объявление без названия");
      const viewsPct = Math.round((ad.views||0) / maxViews * 100);
      const favsPct  = Math.round((ad.fav_count||0) / maxFavs * 100);
      return `
      <div class="stat-card" style="margin-top:4px;cursor:pointer" onclick="toggleStatChart(${idx})">
        <div style="display:flex;gap:10px;align-items:center">
          <div style="width:48px;height:48px;border-radius:8px;overflow:hidden;flex-shrink:0;background:var(--c-skeleton);display:flex;align-items:center;justify-content:center;font-size:20px;">
            ${ad.photo ? `<img src="${esc(ad.photo)}" style="width:100%;height:100%;object-fit:cover">` : "📷"}
          </div>
          <div style="flex:1;min-width:0">
            <div style="font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--c-text-primary);">${esc(safeTitle)}</div>
            <div style="font-size:13px;color:var(--c-text-second)">${fmtPrice(ad.price)}</div>
          </div>
          <div style="text-align:right;flex-shrink:0">
            <div style="font-size:13px;color:var(--c-text-second)">👁 ${fmtNum(ad.views||0)}</div>
            <div style="font-size:13px;color:var(--c-text-second)">♡ ${ad.fav_count||0}</div>
          </div>
          <div style="color:var(--c-text-second);font-size:18px;transform:rotate(0deg);transition:transform .2s" id="stat-chevron-${idx}">›</div>
        </div>
        <div style="margin-top:6px;font-size:12px;${ad.status==='active'
          ? 'color:var(--c-green)'
          : 'color:var(--c-text-second)'}">
          ${ad.status==='active' ? '● Активно' : ad.status==='moderation' ? '○ На модерации' : '○ Снято с публикации'}
        </div>
        <div id="stat-chart-${idx}" style="display:none;margin-top:14px;padding-top:14px;border-top:1px solid var(--c-divider)">
          <div style="font-size:12px;color:var(--c-text-second);margin-bottom:6px;display:flex;justify-content:space-between">
            <span>👁 Просмотры</span><span>${fmtNum(ad.views||0)}</span>
          </div>
          <div style="height:8px;background:var(--c-pill-bg);border-radius:4px;overflow:hidden;margin-bottom:12px">
            <div style="height:100%;width:${viewsPct}%;background:var(--c-accent);border-radius:4px;transition:width .6s ease"></div>
          </div>
          <div style="font-size:12px;color:var(--c-text-second);margin-bottom:6px;display:flex;justify-content:space-between">
            <span>♡ В избранном</span><span>${ad.fav_count||0}</span>
          </div>
          <div style="height:8px;background:var(--c-pill-bg);border-radius:4px;overflow:hidden">
            <div style="height:100%;width:${favsPct}%;background:var(--c-red);border-radius:4px;transition:width .6s ease"></div>
          </div>
          <div style="font-size:11px;color:var(--c-text-second);margin-top:10px;text-align:center">
            Относительно вашего самого популярного объявления
          </div>
        </div>
      </div>`;
    }).join("")}
    <div style="height:16px"></div>`;
}

function toggleStatChart(idx) {
  const chart = document.getElementById(`stat-chart-${idx}`);
  const chevron = document.getElementById(`stat-chevron-${idx}`);
  if (!chart) return;
  const isOpen = chart.style.display !== "none";
  chart.style.display = isOpen ? "none" : "block";
  if (chevron) chevron.style.transform = isOpen ? "rotate(0deg)" : "rotate(90deg)";
  haptic("light");
}

function navigateBack() {
  switchTab("search");
}

function setHeader(backBtn, shareBtn) {
  document.getElementById("btn-back").classList.toggle("visible", backBtn);
  document.getElementById("btn-share").classList.toggle("visible", shareBtn);
}

async function loadAd(adId) {
  STATE.adId = adId;
  document.getElementById("ad-skeleton").style.display = "";
  document.getElementById("ad-content").style.display  = "none";
  document.getElementById("ad-error").style.display    = "none";

  try {
    const data = await apiFetch(`/api/ad/${adId}`);
    STATE.adData    = data;
    STATE.isFavorite = data.is_favorite || false;
    renderAd(data);
    setHeader(true, true);
    updateFavBadge();
    return;
  } catch(e) {
    console.error("Ошибка загрузки объявления:", e);
    document.getElementById("ad-skeleton").style.display = "none";
    document.getElementById("ad-error").style.display = "";
    
    const errBox = document.getElementById("ad-error");
    if (e.status === 404) {
      errBox.innerHTML = `
        <div class="error-icon">📭</div>
        <div class="error-title">Объявление не найдено</div>
        <div class="error-text">Возможно, оно снято с публикации.</div>`;
    } else {
      errBox.innerHTML = `
        <div class="error-icon">⏳</div>
        <div class="error-title">Ошибка соединения</div>
        <div class="error-text">Попробуйте обновить страницу.</div>`;
    }
  }
  setHeader(true, false);
}
  
function renderAd(d) {
  const photos = d.photos || [];
  STATE.curPhoto = 0;

  let galleryHtml = "";
  if (photos.length > 0) {
    const slides = photos.map(url =>
      `<div class="gallery-slide"><img src="${esc(url)}" loading="lazy" decoding="async"></div>`
    ).join("");
    const dots = photos.length > 1
      ? `<div class="gallery-dots">${photos.map((_,i)=>
          `<span class="${i===0?'active':''}"></span>`).join("")}</div>`
      : "";
    galleryHtml = `
      <div class="gallery" id="gallery"
        ontouchstart="gtStart(event)" ontouchend="gtEnd(event)" onclick="galleryTap(event)">
        <div class="gallery-slides" id="gallery-slides">${slides}</div>
        ${dots}
        <div class="gallery-counter" id="gallery-counter">${photos.length>1?`1 / ${photos.length}`:""}</div>
      </div>`;
    if (photos.length > 1) {
      setTimeout(() => {
        const gc = document.getElementById("gallery-counter");
        if (gc) gc.style.display = "block";
      }, 50);
    }
  } else {
    galleryHtml = `<div class="gallery-no-photo">📷</div>`;
  }

  const pills = [];
  if (d.condition) {
    const isNew = d.condition.toLowerCase().includes("нов");
    pills.push(`<span class="pill ${isNew?'green':''}">${esc(d.condition)}</span>`);
  }
  if (d.category) pills.push(`<span class="pill">${esc(stripDot(d.category))}</span>`);
  if (d.city)     pills.push(`<span class="pill">${esc(d.city)}</span>`);
  if (d.size)     pills.push(`<span class="pill">Размер: ${esc(d.size)}</span>`);
  if (d.gender)   pills.push(`<span class="pill">${esc(stripDot(d.gender))}</span>`);

  const s = d.seller || {};
  const sellerId = s.id || 0;
  const avaHtml = `<img src="https://vk.com/images/camera_200.png" alt=""
    onerror="this.style.display='none';this.parentNode.textContent='${esc((s.name||"П")[0].toUpperCase())}'"
    onload="this.style.display='block'"
    style="display:none"
    data-uid="${sellerId}">`;
  const verBadge = s.is_verified ? `<span class="verified-badge">✅</span>` : "";

  const addrVal = d.address
    ? `<a href="https://yandex.ru/maps/?text=${encodeURIComponent((d.city||'')+' '+d.address)}" 
         onclick="openVKLink(this.href);return false;"
         style="color:var(--c-accent);text-decoration:none">${esc(d.address)}</a>`
    : "";

  const metaRows = [
    d.rooms           && ["Комнат",    `<span class="meta-val">${esc(d.rooms)}</span>`],
    d.area            && ["Площадь",   `<span class="meta-val">${esc(d.area)}</span>`],
    d.address         && ["Адрес",     `<span class="meta-val">${addrVal}</span>`],
    d.employment_type && ["Занятость", `<span class="meta-val">${esc(d.employment_type)}</span>`],
  ].filter(Boolean);

  const metaHtml = metaRows.length ? `
    <div class="card card-last">
      ${metaRows.map(([k,v])=>`
        <div class="meta-row">
          <span class="meta-key">${esc(k)}</span>
          ${v}
        </div>`).join("")}
    </div>` : "";

  const statsOwnerHtml = (d.is_owner && d.seller_stats) ? `
    <div class="card">
      <div style="font-size:13px;font-weight:600;color:var(--c-text-second);margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px">Статистика</div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center">
        <div style="background:var(--c-pill-bg);border-radius:10px;padding:10px 4px">
          <div style="font-size:20px;font-weight:700">${fmtNum(d.views)}</div>
          <div style="font-size:11px;color:var(--c-text-second);margin-top:2px">просмотров</div>
        </div>
        <div style="background:var(--c-pill-bg);border-radius:10px;padding:10px 4px">
          <div style="font-size:20px;font-weight:700">${fmtNum(d.favorites_count||0)}</div>
          <div style="font-size:11px;color:var(--c-text-second);margin-top:2px">в избранном</div>
        </div>
        <div style="background:var(--c-pill-bg);border-radius:10px;padding:10px 4px">
          <div style="font-size:20px;font-weight:700">${fmtNum(d.seller_stats.ads_count||0)}</div>
          <div style="font-size:11px;color:var(--c-text-second);margin-top:2px">объявлений</div>
        </div>
      </div>
    </div>` : "";

  const similarHtml = (d.similar && d.similar.length > 0) ? `
    <div style="padding:14px 16px 6px;font-size:13px;font-weight:600;color:var(--c-text-second);text-transform:uppercase;letter-spacing:.5px">Похожие</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 12px 16px">
      ${d.similar.map(s => `
        <div onclick="openAdFromFav(${s.id})" style="background:var(--c-card);border-radius:12px;overflow:hidden;cursor:pointer;transition:opacity .15s" 
             onmousedown="this.style.opacity='.7'" onmouseup="this.style.opacity='1'">
          <div style="aspect-ratio:1;background:var(--c-skeleton);overflow:hidden">
            ${s.photos&&s.photos[0]
              ? `<img src="${esc(s.photos[0])}" style="width:100%;height:100%;object-fit:cover" loading="lazy">`
              : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--c-text-second)">📷</div>`}
          </div>
          <div style="padding:8px">
            <div style="font-size:14px;font-weight:700">${fmtPrice(s.price)}</div>
            <div style="font-size:12px;color:var(--c-text-second);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(s.title || "Без названия")}</div>
          </div>
        </div>`).join("")}
    </div>` : "";

  const descLong = d.description && d.description.length > 280;
  const descHtml = d.description ? `
    <div class="card">
      <div class="desc ${descLong?'desc-clamp':''}" id="desc-text">${esc(d.description)}</div>
      <div class="desc-more ${descLong?'show':''}" id="desc-more" onclick="expandDesc()">Читать полностью</div>
    </div>` : "";

  const contactHtml = d.contact_info ? `
    <div class="card">
      <div class="meta-row" style="padding:0">
        <span class="meta-key">Контакт</span>
        <span class="meta-val" style="word-break:break-all">${esc(d.contact_info)}</span>
      </div>
    </div>` : "";

  const actionBar = d.is_owner ? "" : `
    <div class="action-bar">
      <button class="btn btn-primary" onclick="contactSeller()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        Написать продавцу
      </button>
      <button class="btn btn-fav ${STATE.isFavorite?'is-fav':''}" id="btn-fav" onclick="toggleFavorite()" title="${STATE.isFavorite?'Убрать из избранного':'В избранное'}">
        ${STATE.isFavorite ? "♥" : "♡"}
      </button>
    </div>`;

  const statsHtml = `
    <div class="stats-row" style="margin-top:10px">
      <span>👁 ${fmtNum(d.views)} просмотров</span>
      ${d.created_at ? `<span>📅 ${fmtDate(d.created_at)}</span>` : ""}
    </div>`;

  document.getElementById("ad-skeleton").style.display = "none";
  document.getElementById("ad-content").style.display  = "";
  document.getElementById("ad-content").innerHTML = `
    ${galleryHtml}
    <div class="card" style="border-radius:0 0 ${metaRows.length||d.description||d.contact_info?'0 0':'12px 12px'}">
      <div class="price">${fmtPrice(d.price)}</div>
      <div class="ad-title">${esc(d.title || "Без названия")}</div>
      <div class="pills">${pills.join("")}</div>
      ${statsHtml}
    </div>
    <div class="card">
      <div class="seller-row">
        <div class="seller-ava">${avaHtml}</div>
        <div>
          <div class="seller-name">${esc(s.name||"Продавец")}${verBadge}</div>
          <div class="seller-sub">Продавец${d.is_owner?" · Это вы":""}</div>
        </div>
      </div>
    </div>
    ${descHtml}
    ${contactHtml}
    ${metaHtml}
    ${statsOwnerHtml}
    ${similarHtml}
    ${actionBar}
    <div style="height:8px"></div>
  `;

  setTimeout(async () => {
    const img = document.querySelector(`[data-uid="${sellerId}"]`);
    if (!img) return;
    try {
      const res = await vkBridge.send("VKWebAppCallAPIMethod", {
        method: "users.get",
        params: { user_ids: String(sellerId), fields: "photo_100", v: "5.131" }
      });
      const photo = res?.response?.[0]?.photo_100;
      if (photo) { img.src = photo; img.style.display = "block"; }
      else if (img.parentNode) img.parentNode.textContent = (s.name||"П")[0].toUpperCase();
    } catch(_) {
      if (img.parentNode) img.parentNode.textContent = (s.name||"П")[0].toUpperCase();
    }
  }, 50);
}

function expandDesc() {
  const t = document.getElementById("desc-text");
  const m = document.getElementById("desc-more");
  if (t) t.classList.remove("desc-clamp");
  if (m) m.style.display = "none";
  STATE.descExpanded = true;
}

function setSlide(idx) {
  const photos = (STATE.adData||{}).photos||[];
  if (!photos.length) return;
  STATE.curPhoto = ((idx % photos.length) + photos.length) % photos.length;
  const slides = document.getElementById("gallery-slides");
  if (slides) slides.style.transform = `translateX(${-STATE.curPhoto*100}%)`;
  document.querySelectorAll(".gallery-dots span").forEach((d,i)=>
    d.classList.toggle("active", i===STATE.curPhoto));
  const ctr = document.getElementById("gallery-counter");
  if (ctr) ctr.textContent = `${STATE.curPhoto+1} / ${photos.length}`;
}
function gtStart(e) { STATE.touchX0 = e.touches[0].clientX; STATE.touchY0 = e.touches[0].clientY; }
function gtEnd(e) {
  const dx = e.changedTouches[0].clientX - STATE.touchX0;
  const dy = e.changedTouches[0].clientY - STATE.touchY0;
  if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 30)
    dx < 0 ? setSlide(STATE.curPhoto+1) : setSlide(STATE.curPhoto-1);
}
function galleryTap(e) {
  const photos = (STATE.adData||{}).photos||[];
  if (photos.length <= 1) return;
  const rect = e.currentTarget.getBoundingClientRect();
  const x = e.clientX - rect.left;
  x > rect.width/2 ? setSlide(STATE.curPhoto+1) : setSlide(STATE.curPhoto-1);
}

async function toggleFavorite() {
  if (!STATE.vkUserId) { showToast("Войдите в VK"); return; }
  haptic("light");
  try {
    const data = await apiFetch(`/api/ad/${STATE.adId}/favorite`, { method:"POST" });
    STATE.isFavorite = data.is_favorite;
    const btn = document.getElementById("btn-fav");
    if (btn) {
      btn.textContent = STATE.isFavorite ? "♥" : "♡";
      btn.classList.toggle("is-fav", STATE.isFavorite);
      btn.title = STATE.isFavorite ? "Убрать из избранного" : "В избранное";
    }
    showToast(STATE.isFavorite ? "♥ Добавлено в избранное" : "Убрано из избранного");
    haptic(STATE.isFavorite ? "medium" : "light");
    STATE.favsData = null; // Сбрасываем кэш избранного для принудительного обновления
    updateFavBadge();
  } catch(e) {
    showToast("Ошибка. Попробуйте ещё раз.");
  }
}

function updateFavBadge() {
  const badge = document.getElementById("tab-badge");
  if (!badge) return;
  const cnt = (STATE.favsData || []).length;
  if (cnt > 0) {
    badge.textContent = cnt > 9 ? "9+" : cnt;
    badge.classList.add("show");
  } else {
    badge.classList.remove("show");
  }
  const sep = document.querySelector(".fav-sep");
  if (sep && cnt > 0) sep.textContent = `Сохранённые · ${cnt}`;
}

async function loadFavs() {
  if (STATE.favsLoading) return;
  STATE.favsLoading = true;
  try {
    const data = await apiFetch("/api/favorites");
    STATE.favsData = data.items || [];
    renderFavs(STATE.favsData);
  } catch(e) {
    document.getElementById("favs-skeleton").innerHTML = `
      <div class="error-screen">
        <div class="error-icon">😕</div>
        <div class="error-title">Не удалось загрузить</div>
        <div class="error-text">Проверьте соединение и попробуйте снова.</div>
      </div>`;
  } finally {
    STATE.favsLoading = false;
  }
}

function renderFavs(items) {
  document.getElementById("favs-skeleton").style.display = "none";
  const wrap = document.getElementById("favs-content");
  wrap.style.display = "";

  if (!items.length) {
    wrap.innerHTML = `
      <div class="fav-empty">
        <div class="fav-empty-icon">🤍</div>
        <div class="fav-empty-title">Пока пусто</div>
        <div class="fav-empty-text">Нажмите ♡ в понравившихся объявлениях,<br>и они появятся здесь.</div>
      </div>`;
    return;
  }

  const badge = document.getElementById("tab-badge");
  if (badge && items.length > 0) {
    badge.textContent = items.length > 9 ? "9+" : items.length;
    badge.classList.add("show");
  }

  wrap.innerHTML = `
    <div class="fav-sep">Сохранённые · ${items.length}</div>
    <div class="fav-list" id="fav-list">
      ${items.map(ad => `
        <div class="fav-item" onclick="openAdFromFav(${ad.id})" data-id="${ad.id}">
          <div class="fav-thumb">
            ${ad.photos&&ad.photos[0]
              ? `<img src="${esc(ad.photos[0])}" loading="lazy">`
              : "📷"}
          </div>
          <div class="fav-info">
            <div class="fav-price">${fmtPrice(ad.price)}</div>
            <div class="fav-title">${esc(ad.title || "Без названия")}</div>
            <div class="fav-city">${esc(ad.city||"")}</div>
          </div>
          <button class="fav-del" onclick="removeFav(event,${ad.id})" title="Убрать">✕</button>
        </div>`).join("")}
    </div>`;
}

async function removeFav(e, adId) {
  e.stopPropagation();
  haptic("light");
  try {
    await apiFetch(`/api/ad/${adId}/favorite`, { method:"POST" });
    const item = document.querySelector(`.fav-item[data-id="${adId}"]`);
    if (item) {
      item.style.transition = "opacity .2s,transform .2s";
      item.style.opacity = "0";
      item.style.transform = "translateX(40px)";
      setTimeout(() => {
        item.remove();
        STATE.favsData = (STATE.favsData||[]).filter(a=>a.id!==adId);
        if (!STATE.favsData.length) renderFavs([]);
        updateFavBadge();
      }, 220);
    }
    if (adId === STATE.adId) {
      STATE.isFavorite = false;
      const btn = document.getElementById("btn-fav");
      if (btn) { btn.textContent="♡"; btn.classList.remove("is-fav"); }
    }
    showToast("Убрано из избранного");
  } catch(e) {
    showToast("Ошибка. Попробуйте ещё раз.");
  }
}

function openAdFromFav(adId) {
  haptic("light");
  if (adId === STATE.adId) {
    switchTab("ad");
    return;
  }
  STATE.adData = null;
  document.getElementById("ad-skeleton").style.display = "";
  document.getElementById("ad-content").style.display  = "none";
  document.getElementById("ad-error").style.display    = "none";
  switchTab("ad");
  loadAd(adId);
}

function contactSeller() {
  if (!STATE.adData || !STATE.adData.seller || !STATE.adData.seller.id) return;
  haptic("medium");
  const sellerId = STATE.adData.seller.id;
  try {
    vkBridge.send("VKWebAppOpenApp", {
      app_id: 6146827,
      hash: `im?sel=${sellerId}`
    });
  } catch(_) {}
  openVKLink(`https://vk.com/im?sel=${sellerId}`);
}

async function shareAd() {
  haptic("light");
  const url = `https://vk.com/app${CFG.VK_APP_ID}#ad_${STATE.adId}`;
  try {
    await vkBridge.send("VKWebAppShare", { link: url });
  } catch(_) {
    try {
      await navigator.clipboard.writeText(url);
      showToast("Ссылка скопирована");
    } catch(_) {
      showToast("Поделитесь ссылкой: " + url);
    }
  }
}

function openVKLink(url) {
  try {
    vkBridge.send("VKWebAppOpenLink", { link: url });
  } catch(_) {
    window.open(url, "_blank");
  }
}

function fmtPrice(p) {
  if (!p) return "Цена не указана";
  if (p === 1) return "Бесплатно";
  return new Intl.NumberFormat("ru-RU").format(p) + " ₽";
}
function fmtNum(n) {
  return new Intl.NumberFormat("ru-RU").format(n||0);
}
function fmtDate(iso) {
  if (!iso) return "";
  try {
    const d = new Date(iso);
    return d.toLocaleDateString("ru-RU", { day:"numeric", month:"long" });
  } catch(_) { return ""; }
}
function esc(s) {
  return String(s||"")
    .replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function stripDot(s) { return String(s||"").replace(/^[·•]\s*/,""); }
function trimTitle(s,n) {
  s = String(s||"");
  return s.length > n ? s.slice(0,n)+"…" : s;
}

let _toastTimer;
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => t.classList.remove("show"), 2500);
}

function getAdIdFromUrl() {
  let hash = window.location.hash.replace("#", "").replace("ad_", "").trim();
  let adId = parseInt(hash);
  if (adId && adId > 0) return adId;

  const params = new URLSearchParams(window.location.search);
  const queryHash = params.get("hash") || "";
  hash = queryHash.replace("ad_", "").trim();
  adId = parseInt(hash);
  if (adId && adId > 0) return adId;

  return 0;
}

async function main() {
  await initVK();

  const adId = getAdIdFromUrl();

  if (adId && adId > 0) {
    await loadAd(adId);
    switchTab("ad");
  } else {
    document.getElementById("ad-skeleton").style.display = "none";
    document.getElementById("ad-error").style.display    = "";
    document.getElementById("ad-error").innerHTML = `
      <div class="error-icon">🏷️</div>
      <div class="error-title">Полка</div>
      <div class="error-text">Откройте любое объявление из группы,<br>чтобы увидеть его здесь.</div>`;
    
    switchTab("search");
  }
}

main();
</script>
