<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Полка Удмуртия</title>
<script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
<style>
  :root {
    --accent: #4C7EFF;
    --accent2: #5C8EFF;
    --bg: #f2f3f5;
    --card: #ffffff;
    --text: #1c1c1e;
    --sub: #6c757d;
    --border: #e8eaed;
    --danger: #e64646;
    --green: #4BB34B;
    --radius: 14px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bot: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, 'SF Pro Text', Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  /* NAV */
  .nav { position: sticky; top: 0; z-index: 100; background: var(--card); border-bottom: 1px solid var(--border); padding: calc(var(--safe-top) + 10px) 16px 10px; display: flex; align-items: center; gap: 10px; }
  .nav-back { width: 36px; height: 36px; border: none; background: var(--bg); border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
  .nav-title { font-size: 17px; font-weight: 600; flex: 1; }
  .nav-logo { font-size: 17px; font-weight: 700; color: var(--accent); }

  /* TABS */
  .tabs { display: flex; background: var(--card); border-bottom: 1px solid var(--border); }
  .tab { flex: 1; padding: 12px 4px; text-align: center; font-size: 12px; font-weight: 500; color: var(--sub); border: none; background: none; cursor: pointer; border-bottom: 2px solid transparent; transition: color .15s; }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  /* SEARCH BAR */
  .search-bar { padding: 10px 12px; background: var(--card); border-bottom: 1px solid var(--border); display: flex; gap: 8px; }
  .search-input { flex: 1; border: 1.5px solid var(--border); border-radius: 10px; padding: 9px 12px; font-size: 15px; outline: none; background: var(--bg); transition: border-color .15s; }
  .search-input:focus { border-color: var(--accent); }
  .btn-icon { width: 40px; height: 40px; border: none; border-radius: 10px; background: var(--accent); color: #fff; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

  /* FILTERS */
  .filters { padding: 8px 12px; display: flex; gap: 8px; overflow-x: auto; background: var(--card); border-bottom: 1px solid var(--border); scrollbar-width: none; }
  .filters::-webkit-scrollbar { display: none; }
  .filter-chip { white-space: nowrap; border: 1.5px solid var(--border); border-radius: 20px; padding: 5px 12px; font-size: 13px; cursor: pointer; background: var(--bg); color: var(--text); flex-shrink: 0; transition: all .15s; }
  .filter-chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* CARDS */
  .feed { padding: 10px 12px; display: flex; flex-direction: column; gap: 10px; }
  .card { background: var(--card); border-radius: var(--radius); overflow: hidden; cursor: pointer; transition: transform .1s; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  .card:active { transform: scale(.98); }
  .card-img { width: 100%; height: 180px; object-fit: cover; background: var(--bg); }
  .card-img-placeholder { width: 100%; height: 140px; background: var(--bg); display: flex; align-items: center; justify-content: center; font-size: 40px; color: #ccc; }
  .card-body { padding: 12px; }
  .card-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .card-price { font-size: 18px; font-weight: 700; color: var(--accent); margin-bottom: 6px; }
  .card-meta { font-size: 12px; color: var(--sub); display: flex; gap: 10px; flex-wrap: wrap; }
  .badge { display: inline-block; padding: 2px 7px; border-radius: 6px; font-size: 11px; font-weight: 600; }
  .badge-new { background: #e8f5e9; color: #2e7d32; }
  .badge-used { background: #fff3e0; color: #e65100; }

  /* AD DETAIL */
  .detail-photos { position: relative; }
  .detail-photo { width: 100%; max-height: 320px; object-fit: cover; }
  .photo-counter { position: absolute; bottom: 10px; right: 12px; background: rgba(0,0,0,.5); color: #fff; font-size: 12px; padding: 3px 8px; border-radius: 10px; }
  .detail-body { padding: 14px 16px; }
  .detail-title { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
  .detail-price { font-size: 26px; font-weight: 800; color: var(--accent); margin-bottom: 12px; }
  .detail-section { margin-bottom: 14px; }
  .detail-section-title { font-size: 12px; font-weight: 600; color: var(--sub); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
  .detail-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
  .detail-row:last-child { border-bottom: none; }
  .detail-row-label { color: var(--sub); }
  .detail-desc { font-size: 15px; line-height: 1.5; white-space: pre-wrap; }
  .map-link { display: block; margin-top: 6px; color: var(--accent); font-size: 14px; text-decoration: none; }
  .seller-card { display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--bg); border-radius: 10px; cursor: pointer; }
  .seller-avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 18px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .seller-name { font-size: 15px; font-weight: 600; }
  .seller-sub { font-size: 12px; color: var(--sub); margin-top: 2px; }
  .stars { color: #f9a825; }

  /* ACTIONS */
  .action-bar { position: sticky; bottom: 0; padding: 10px 12px calc(var(--safe-bot) + 10px); background: var(--card); border-top: 1px solid var(--border); display: flex; gap: 10px; }
  .btn { flex: 1; padding: 13px; border: none; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; transition: opacity .15s; }
  .btn:active { opacity: .8; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-secondary { background: var(--bg); color: var(--text); border: 1.5px solid var(--border); }
  .btn-fav { width: 50px; flex: none; font-size: 22px; background: var(--bg); border: 1.5px solid var(--border); border-radius: 12px; }
  .btn-fav.active { color: var(--danger); border-color: var(--danger); }

  /* MISC */
  .empty { text-align: center; padding: 60px 20px; color: var(--sub); }
  .empty-icon { font-size: 48px; margin-bottom: 12px; }
  .empty-text { font-size: 16px; font-weight: 500; }
  .empty-sub { font-size: 14px; margin-top: 6px; }
  .loader { text-align: center; padding: 40px; color: var(--sub); }
  .spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; margin: 0 auto 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .toast { position: fixed; bottom: calc(var(--safe-bot) + 80px); left: 50%; transform: translateX(-50%); background: #1c1c1e; color: #fff; padding: 10px 18px; border-radius: 20px; font-size: 14px; z-index: 999; opacity: 0; transition: opacity .2s; pointer-events: none; white-space: nowrap; }
  .toast.show { opacity: 1; }
  .sort-bar { display: flex; gap: 6px; padding: 8px 12px; overflow-x: auto; scrollbar-width: none; }
  .sort-bar::-webkit-scrollbar { display: none; }
  .sort-chip { white-space: nowrap; border: 1.5px solid var(--border); border-radius: 20px; padding: 4px 10px; font-size: 12px; cursor: pointer; background: var(--bg); transition: all .15s; flex-shrink: 0; }
  .sort-chip.active { background: var(--text); color: #fff; border-color: var(--text); }
  .dot { color: var(--sub); }
  .page-btns { display: flex; justify-content: center; gap: 10px; padding: 12px; }
  .page-btn { padding: 8px 18px; border: 1.5px solid var(--border); border-radius: 10px; background: var(--card); font-size: 14px; cursor: pointer; }
  .page-btn:disabled { opacity: .4; cursor: not-allowed; }

  /* MODAL */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 200; display: flex; align-items: flex-end; }
  .modal-overlay.hidden { display: none; }
  .modal { background: var(--card); border-radius: 20px 20px 0 0; width: 100%; max-height: 90vh; overflow-y: auto; padding: 20px 16px calc(var(--safe-bot) + 20px); }
  .modal-title { font-size: 17px; font-weight: 700; margin-bottom: 16px; text-align: center; }
  .modal-close { position: absolute; top: 14px; right: 16px; font-size: 22px; cursor: pointer; color: var(--sub); }
  .select-opt { display: flex; align-items: center; justify-content: space-between; padding: 12px 4px; border-bottom: 1px solid var(--border); cursor: pointer; font-size: 15px; }
  .select-opt:last-child { border-bottom: none; }
  .select-opt.selected { color: var(--accent); font-weight: 600; }
</style>
</head>
<body>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- FILTER MODAL -->
<div class="modal-overlay hidden" id="filterModal">
  <div class="modal" style="position:relative">
    <span class="modal-close" onclick="closeModal()">✕</span>
    <div class="modal-title">Фильтры</div>
    <div id="modalContent"></div>
    <button class="btn btn-primary" style="width:100%;margin-top:14px" onclick="applyFilters()">Применить</button>
    <button class="btn btn-secondary" style="width:100%;margin-top:8px" onclick="resetFilters()">Сбросить</button>
  </div>
</div>

<!-- APP -->
<div id="app"></div>

<script>
// ── CONFIG ──────────────────────────────────────────────────────────────────
const API = "https://YOUR_API_URL";  // ← сюда вставить URL вашего сервера
const BOT_SCREEN = "polkaudm";

// ── STATE ───────────────────────────────────────────────────────────────────
let vkUserId = 0;
let currentScreen = "feed";
let feedState = { ads: [], page: 0, pages: 1, loading: false, query: "", city: "", cat: "", sort: "date" };
let favState   = { ads: [], page: 0, pages: 1, loading: false };
let detailState = { ad: null, seller: null, rating: null, isFav: false, photoIdx: 0 };
let filterDraft = {};

// ── VK BRIDGE ───────────────────────────────────────────────────────────────
async function initVK() {
  try {
    await vkBridge.send("VKWebAppInit");
    const me = await vkBridge.send("VKWebAppGetUserInfo");
    vkUserId = me.id;
  } catch(e) {
    console.warn("vkBridge init:", e);
  }
}

// ── ROUTER ──────────────────────────────────────────────────────────────────
function navigate(screen, params = {}) {
  currentScreen = screen;
  if (screen === "feed")   renderFeed();
  if (screen === "favs")   renderFavs();
  if (screen === "detail") renderDetail(params.adId);
}

// ── API ─────────────────────────────────────────────────────────────────────
async function apiFetch(path) {
  const r = await fetch(API + path);
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

async function apiPost(path, body) {
  const r = await fetch(API + path, {
    method: "POST", headers: {"Content-Type":"application/json"},
    body: JSON.stringify(body)
  });
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

// ── HELPERS ─────────────────────────────────────────────────────────────────
function fmtPrice(p) { return Number(p).toLocaleString("ru-RU") + " ₽"; }
function esc(s) { return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 2200);
}
function stars(avg, cnt) {
  if (!cnt) return '<span class="dot">Нет отзывов</span>';
  const full = Math.round(avg);
  return `<span class="stars">${"★".repeat(full)}${"☆".repeat(5-full)}</span> ${avg} (${cnt})`;
}
function mapUrl(address, city) {
  return "https://yandex.ru/maps/?text=" + encodeURIComponent([address, city].filter(Boolean).join(" "));
}

// ── FEED ────────────────────────────────────────────────────────────────────
async function loadFeed(reset = false) {
  if (feedState.loading) return;
  if (reset) { feedState.page = 0; feedState.ads = []; }
  feedState.loading = true;
  renderFeedContent();

  const qs = new URLSearchParams({
    q: feedState.query, city: feedState.city,
    category: feedState.cat, sort: feedState.sort,
    page: feedState.page, limit: 20,
  });
  try {
    const data = await apiFetch("/api/ads/search?" + qs);
    if (reset) feedState.ads = data.ads;
    else feedState.ads = [...feedState.ads, ...data.ads];
    feedState.pages = data.pages;
    feedState.total = data.total;
  } catch(e) { toast("Ошибка загрузки"); }
  feedState.loading = false;
  renderFeedContent();
}

function renderFeed() {
  document.getElementById("app").innerHTML = `
    <div class="nav">
      <span class="nav-logo">📦 Полка</span>
      <span class="nav-title"></span>
    </div>
    <div class="tabs">
      <button class="tab active" onclick="navigate('feed')">🏠 Объявления</button>
      <button class="tab" onclick="navigate('favs')">♡ Избранное</button>
    </div>
    <div class="search-bar">
      <input class="search-input" id="searchInput" placeholder="Поиск товаров..." value="${esc(feedState.query)}">
      <button class="btn-icon" onclick="doSearch()">🔍</button>
      <button class="btn-icon" style="background:var(--bg);color:var(--text);border:1.5px solid var(--border)" onclick="openFilters()">⚙️</button>
    </div>
    <div class="filters" id="cityFilters"></div>
    <div class="sort-bar" id="sortBar"></div>
    <div id="feedContent"></div>
  `;
  document.getElementById("searchInput").addEventListener("keydown", e => { if(e.key==="Enter") doSearch(); });
  renderCityChips();
  renderSortChips();
  if (!feedState.ads.length) loadFeed(true);
  else renderFeedContent();
}

function renderCityChips() {
  const cities = ["Все", "Ижевск", "Сарапул", "Воткинск", "Глазов", "Можга"];
  document.getElementById("cityFilters").innerHTML = cities.map(c => {
    const active = (c === "Все" && !feedState.city) || c === feedState.city;
    return `<span class="filter-chip ${active?"active":""}" onclick="setCity('${c==="Все"?"":c}')">${c}</span>`;
  }).join("");
}

function renderSortChips() {
  const sorts = [["date","По дате"],["price_asc","Дешевле"],["price_desc","Дороже"],["views","Популярные"]];
  document.getElementById("sortBar").innerHTML = sorts.map(([v,l]) =>
    `<span class="sort-chip ${feedState.sort===v?"active":""}" onclick="setSort('${v}')">${l}</span>`
  ).join("");
}

function setCity(city) { feedState.city = city; loadFeed(true); renderCityChips(); }
function setSort(sort) { feedState.sort = sort; loadFeed(true); renderSortChips(); }

function doSearch() {
  feedState.query = document.getElementById("searchInput").value.trim();
  loadFeed(true);
}

function renderFeedContent() {
  const el = document.getElementById("feedContent");
  if (!el) return;
  if (!feedState.ads.length && feedState.loading) {
    el.innerHTML = `<div class="loader"><div class="spinner"></div>Загружаем объявления…</div>`;
    return;
  }
  if (!feedState.ads.length) {
    el.innerHTML = `<div class="empty"><div class="empty-icon">🔍</div><div class="empty-text">Ничего не найдено</div><div class="empty-sub">Попробуйте другой запрос</div></div>`;
    return;
  }
  const cards = feedState.ads.map(ad => adCard(ad)).join("");
  const hasMore = feedState.page + 1 < feedState.pages;
  el.innerHTML = `
    <div class="feed">${cards}</div>
    ${hasMore ? `<div class="page-btns"><button class="page-btn" onclick="loadMore()">Загрузить ещё</button></div>` : ""}
    <div style="padding:8px 0;text-align:center;color:var(--sub);font-size:12px">Всего: ${feedState.total||0}</div>
  `;
}

function loadMore() { feedState.page++; loadFeed(false); }

function adCard(ad) {
  const img = ad.photos && ad.photos[0]
    ? `<img class="card-img" src="${esc(ad.photos[0])}" loading="lazy" onerror="this.style.display='none'">`
    : `<div class="card-img-placeholder">📦</div>`;
  const city = ad.city ? `<span>📍 ${esc(ad.city)}</span>` : "";
  const cond = ad.condition ? `<span class="badge ${ad.condition==="Новое"?"badge-new":"badge-used"}">${esc(ad.condition)}</span>` : "";
  return `
    <div class="card" onclick="navigate('detail',{adId:${ad.id}})">
      ${img}
      <div class="card-body">
        <div class="card-title">${esc(ad.title)}</div>
        <div class="card-price">${fmtPrice(ad.price)}</div>
        <div class="card-meta">${city}${cond}</div>
      </div>
    </div>`;
}

// ── FAVS ────────────────────────────────────────────────────────────────────
async function renderFavs() {
  document.getElementById("app").innerHTML = `
    <div class="nav">
      <span class="nav-logo">📦 Полка</span>
      <span class="nav-title"></span>
    </div>
    <div class="tabs">
      <button class="tab" onclick="navigate('feed')">🏠 Объявления</button>
      <button class="tab active" onclick="navigate('favs')">♡ Избранное</button>
    </div>
    <div id="favsContent"><div class="loader"><div class="spinner"></div>Загружаем…</div></div>
  `;
  if (!vkUserId) { document.getElementById("favsContent").innerHTML = `<div class="empty"><div class="empty-icon">🔐</div><div class="empty-text">Войдите через VK</div></div>`; return; }
  try {
    const data = await apiFetch(`/api/favorites?user_id=${vkUserId}`);
    const el = document.getElementById("favsContent");
    if (!data.ads.length) {
      el.innerHTML = `<div class="empty"><div class="empty-icon">♡</div><div class="empty-text">Избранное пусто</div><div class="empty-sub">Сохраняйте понравившиеся объявления</div></div>`;
    } else {
      el.innerHTML = `<div class="feed">${data.ads.map(adCard).join("")}</div>`;
    }
  } catch(e) { toast("Ошибка загрузки избранного"); }
}

// ── DETAIL ──────────────────────────────────────────────────────────────────
async function renderDetail(adId) {
  document.getElementById("app").innerHTML = `
    <div class="nav">
      <button class="nav-back" onclick="history.back()">←</button>
      <span class="nav-title">Объявление</span>
    </div>
    <div id="detailContent"><div class="loader"><div class="spinner"></div>Загружаем…</div></div>
  `;
  try {
    const data = await apiFetch(`/api/ads/${adId}?viewer_id=${vkUserId}`);
    detailState = { ad: data.ad, seller: data.seller, rating: data.rating, isFav: data.is_favorite, photoIdx: 0 };
    renderDetailContent();
  } catch(e) {
    document.getElementById("detailContent").innerHTML = `<div class="empty"><div class="empty-icon">😕</div><div class="empty-text">Объявление не найдено</div></div>`;
  }
}

function renderDetailContent() {
  const { ad, seller, rating, isFav, photoIdx } = detailState;
  const photos = ad.photos || [];

  const photoBlock = photos.length
    ? `<div class="detail-photos" onclick="nextPhoto()">
         <img class="detail-photo" src="${esc(photos[photoIdx])}" id="detailPhoto">
         ${photos.length>1 ? `<div class="photo-counter">${photoIdx+1}/${photos.length}</div>` : ""}
       </div>`
    : `<div class="card-img-placeholder" style="height:200px">📦</div>`;

  const rows = [
    ad.condition && ["Состояние", ad.condition],
    ad.category  && ["Категория", ad.category.replace(/^·\s*/,"")],
    ad.size      && ["Размер", ad.size],
    ad.city      && ["Город", ad.city],
    ad.delivery  && ["Доставка", ad.delivery],
  ].filter(Boolean);

  const sellerName = seller?.first_name || "Продавец";
  const sellerInitial = sellerName[0] || "?";
  const verified = seller?.is_verified ? ' <span style="color:var(--green)">✓</span>' : "";

  const mapLink = (ad.address && ad.city)
    ? `<a class="map-link" href="${mapUrl(ad.address, ad.city)}" target="_blank">📍 ${esc(ad.address)} — посмотреть на карте</a>`
    : ad.city ? `<span style="color:var(--sub);font-size:14px">📍 ${esc(ad.city)}</span>` : "";

  document.getElementById("detailContent").innerHTML = `
    ${photoBlock}
    <div class="detail-body">
      <div class="detail-title">${esc(ad.title)}</div>
      <div class="detail-price">${fmtPrice(ad.price)}</div>

      ${rows.length ? `
      <div class="detail-section">
        <div class="detail-section-title">Параметры</div>
        ${rows.map(([l,v])=>`<div class="detail-row"><span class="detail-row-label">${l}</span><span>${esc(v)}</span></div>`).join("")}
      </div>` : ""}

      ${ad.description ? `
      <div class="detail-section">
        <div class="detail-section-title">Описание</div>
        <div class="detail-desc">${esc(ad.description)}</div>
      </div>` : ""}

      ${mapLink ? `<div class="detail-section">${mapLink}</div>` : ""}

      <div class="detail-section">
        <div class="detail-section-title">Продавец</div>
        <div class="seller-card" onclick="openBotContact(${ad.id})">
          <div class="seller-avatar">${sellerInitial}</div>
          <div>
            <div class="seller-name">${esc(sellerName)}${verified}</div>
            <div class="seller-sub">${stars(rating?.avg, rating?.count)}</div>
          </div>
          <span style="margin-left:auto;color:var(--sub)">›</span>
        </div>
      </div>
    </div>

    <div class="action-bar">
      <button class="btn btn-fav ${isFav?"active":""}" id="favBtn" onclick="toggleFav(${ad.id})">${isFav?"♥":"♡"}</button>
      <button class="btn btn-secondary" onclick="openBotContact(${ad.id})">✉ Написать</button>
      <button class="btn btn-primary" onclick="openInBot(${ad.id})">Открыть в боте</button>
    </div>
  `;
}

function nextPhoto() {
  const photos = detailState.ad?.photos || [];
  if (photos.length < 2) return;
  detailState.photoIdx = (detailState.photoIdx + 1) % photos.length;
  const el = document.getElementById("detailPhoto");
  if (el) el.src = photos[detailState.photoIdx];
  const cnt = document.querySelector(".photo-counter");
  if (cnt) cnt.textContent = `${detailState.photoIdx+1}/${photos.length}`;
}

async function toggleFav(adId) {
  if (!vkUserId) { toast("Войдите через VK"); return; }
  try {
    const data = await apiPost("/api/favorites/toggle", { user_id: vkUserId, ad_id: adId });
    detailState.isFav = data.is_favorite;
    const btn = document.getElementById("favBtn");
    btn.textContent = data.is_favorite ? "♥" : "♡";
    btn.classList.toggle("active", data.is_favorite);
    toast(data.is_favorite ? "Добавлено в избранное" : "Удалено из избранного");
  } catch(e) { toast("Ошибка"); }
}

function openBotContact(adId) {
  openInVK(`https://vk.me/${BOT_SCREEN}?ref=contact_${adId}`);
}

function openInBot(adId) {
  openInVK(`https://vk.me/${BOT_SCREEN}?ref=ad_${adId}`);
}

function openInVK(url) {
  try {
    vkBridge.send("VKWebAppOpenLink", { link: url });
  } catch(e) {
    window.open(url, "_blank");
  }
}

// ── FILTERS ─────────────────────────────────────────────────────────────────
let allCities = [], allCats = [];

async function openFilters() {
  if (!allCities.length) {
    try {
      const d = await apiFetch("/api/dict");
      allCities = d.cities; allCats = d.categories;
    } catch(e) {}
  }
  filterDraft = { city: feedState.city, cat: feedState.cat };
  renderFilterModal();
  document.getElementById("filterModal").classList.remove("hidden");
}

function renderFilterModal() {
  document.getElementById("modalContent").innerHTML = `
    <div class="detail-section-title" style="margin-bottom:8px">Город</div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px">
      <span class="filter-chip ${!filterDraft.city?"active":""}" onclick="setDraftCity('')">Все</span>
      ${allCities.map(c=>`<span class="filter-chip ${filterDraft.city===c?"active":""}" onclick="setDraftCity('${c}')">${c}</span>`).join("")}
    </div>
    <div class="detail-section-title" style="margin-bottom:8px">Категория</div>
    <div style="display:flex;flex-wrap:wrap;gap:6px">
      <span class="filter-chip ${!filterDraft.cat?"active":""}" onclick="setDraftCat('')">Все</span>
      ${allCats.map(c=>`<span class="filter-chip ${filterDraft.cat===c?"active":""}" onclick="setDraftCat('${c}')">${esc(c)}</span>`).join("")}
    </div>
  `;
}

function setDraftCity(c) { filterDraft.city = c; renderFilterModal(); }
function setDraftCat(c)  { filterDraft.cat  = c; renderFilterModal(); }

function applyFilters() {
  feedState.city = filterDraft.city;
  feedState.cat  = filterDraft.cat;
  closeModal();
  loadFeed(true);
  renderCityChips();
}

function resetFilters() {
  feedState.city = ""; feedState.cat = "";
  filterDraft = {};
  closeModal();
  loadFeed(true);
}

function closeModal() {
  document.getElementById("filterModal").classList.add("hidden");
}

// ── DEEP LINK из поста ───────────────────────────────────────────────────────
function handleStartParam() {
  const params = new URLSearchParams(location.search);
  // VK передаёт #vk_app_id=...&vk_user_id=...&start_group=...
  const hash = new URLSearchParams(location.hash.replace("#",""));
  const startParam = params.get("vk_ref") || hash.get("vk_ref") || "";
  const m = startParam.match(/^(ad|contact|favorite)_(\d+)$/);
  if (m) navigate("detail", { adId: parseInt(m[2]) });
  else navigate("feed");
}

// ── BACK BUTTON ──────────────────────────────────────────────────────────────
window.addEventListener("popstate", () => navigate("feed"));

// ── INIT ────────────────────────────────────────────────────────────────────
(async () => {
  await initVK();
  handleStartParam();
})();
</script>
