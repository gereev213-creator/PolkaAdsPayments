<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Полка — Маркетплейс Удмуртии</title>
  <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
  <style>
    * {
      margin: 0; padding: 0; box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, Inter, sans-serif;
    }
    :root {
      --bg: #f2f5f8; --card: #ffffff;
      --accent: #4c7eff; --accent2: #6ea1ff;
      --text: #121212; --sub: #7c8591;
      --border: #e8edf3; --shadow: 0 4px 20px rgba(0,0,0,.05);
    }
    body { background: var(--bg); color: var(--text); overflow-x: hidden; }
    #app { min-height: 100vh; padding-bottom: 110px; }
    
    /* Шапка */
    .topbar {
      position: sticky; top: 0; z-index: 100;
      background: rgba(242,245,248,.82); backdrop-filter: blur(16px);
      padding: env(safe-area-inset-top) 18px 16px 16px;
    }
    .topbar-row { display: flex; align-items: center; justify-content: space-between; }
    .logo-wrap { display: flex; align-items: center; gap: 12px; }
    .logo { width: 42px; height: 42px; object-fit: contain; }
    .brand { font-size: 24px; font-weight: 800; letter-spacing: -.4px; }
    .top-actions { display: flex; gap: 8px; }
    .user-btn, .mock-btn {
      height: 42px; border-radius: 14px; background: white;
      display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow); cursor: pointer;
    }
    .user-btn { width: 42px; border-radius: 50%; }
    .mock-btn { padding: 0 12px; font-size: 12px; font-weight: 700; color: var(--accent); border: 1px dashed var(--accent); }
    .user-btn img { width: 22px; opacity: .85; }
    .search { margin-top: 16px; background: white; border-radius: 18px; padding: 14px 16px; display: flex; align-items: center; gap: 10px; box-shadow: var(--shadow); }
    .search input { border: none; outline: none; width: 100%; font-size: 16px; background: transparent; }
    
    /* Категории */
    .categories { display: flex; gap: 12px; overflow-x: auto; padding: 18px 16px 8px; }
    .categories::-webkit-scrollbar { display: none; }
    .cat { min-width: 92px; background: white; border-radius: 22px; padding: 14px 10px; text-align: center; box-shadow: var(--shadow); cursor: pointer; }
    .cat.active { background: var(--accent); color: white; }
    .cat img { width: 38px; height: 38px; object-fit: contain; margin-bottom: 8px; }
    .cat-title { font-size: 13px; font-weight: 700; }
    
    /* Лента */
    .feed { padding: 8px 16px; display: grid; gap: 18px; }
    .card { background: white; border-radius: 28px; overflow: hidden; box-shadow: var(--shadow); position: relative; }
    .card-photo { position: relative; aspect-ratio: 1/1; overflow: hidden; background: #f9f9f9; }
    .card-photo img { width: 100%; height: 100%; object-fit: cover; }
    .card-body { padding: 16px; }
    .price { font-size: 26px; font-weight: 800; margin-bottom: 8px; }
    .title { font-size: 17px; font-weight: 700; line-height: 1.35; margin-bottom: 10px; }
    .meta { display: flex; align-items: center; justify-content: space-between; color: var(--sub); font-size: 14px; }
    .seller { display: flex; align-items: center; gap: 8px; }
    .seller img { width: 22px; opacity: .7; }
    
    /* Кнопка Избранного на карточке */
    .fav-badge {
      position: absolute; top: 16px; right: 16px; width: 40px; height: 40px;
      border-radius: 50%; background: white; display: flex; align-items: center;
      justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.15); z-index: 10; cursor: pointer; font-size: 20px;
    }

    /* Навигация */
    .bottom-nav {
      position: fixed; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom) + 12px);
      background: rgba(255,255,255,.92); border-radius: 28px; padding: 12px 10px;
      display: flex; justify-content: space-around; backdrop-filter: blur(16px);
      box-shadow: 0 8px 40px rgba(0,0,0,.1); z-index: 500;
    }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: #8b97a6; cursor: pointer; }
    .nav-item.active { color: var(--accent); }
    .nav-icon { font-size: 22px; }
    .create-btn { transform: translateY(-22px); width: 64px; height: 64px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: white; display: flex; align-items: center; justify-content: center; font-size: 34px; font-weight: 300; box-shadow: 0 10px 30px rgba(76,126,255,.35); cursor: pointer; }
    
    .hero { margin: 16px; padding: 24px; border-radius: 30px; background: linear-gradient(135deg, #4c7eff, #75a3ff); color: white; position: relative; overflow: hidden; }
    .hero h2 { font-size: 30px; line-height: 1.1; margin-bottom: 10px; }
    .hero p { opacity: .92; line-height: 1.45; max-width: 70%; }
    .page-title { font-size: 22px; font-weight: 800; padding: 16px; }
    .empty-feed { text-align: center; padding: 40px 20px; color: var(--sub); font-size: 16px; }
    .tab-content { padding: 20px; text-align: left; margin-top: 10px; }

    /* Модалка формы */
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.4); z-index: 2000;
      display: none; align-items: flex-end; justify-content: center;
    }
    .modal-overlay.active { display: flex; }
    .modal-content {
      background: white; width: 100%; max-width: 500px;
      border-top-left-radius: 32px; border-top-right-radius: 32px;
      padding: 24px 24px calc(env(safe-area-inset-bottom) + 24px);
      box-shadow: 0 -10px 40px rgba(0,0,0,0.15);
      animation: slideUp 0.3s ease-out;
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .modal-title { font-size: 22px; font-weight: 800; }
    .close-modal { font-size: 28px; color: var(--sub); cursor: pointer; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 14px; font-weight: 700; color: var(--sub); margin-bottom: 6px; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: 14px; border: 1px solid var(--border);
      border-radius: 16px; background: var(--bg); font-size: 16px; outline: none;
    }
    .form-submit {
      width: 100%; padding: 16px; border: none; border-radius: 18px;
      background: var(--accent); color: white; font-size: 16px; font-weight: 700;
      cursor: pointer; margin-top: 10px; box-shadow: 0 4px 15px rgba(76,126,255,0.2);
    }
    .chat-item { background: white; padding: 16px; border-radius: 20px; margin-bottom: 12px; box-shadow: var(--shadow); display: flex; gap: 14px; align-items: center; }
    .chat-avatar { width: 45px; height: 45px; background: #e2e8f0; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; }
  </style>
</head>
<body>
  <div id="app"></div>

  <div class="modal-overlay" id="createModal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title">Новое объявление</div>
        <div class="close-modal" onclick="toggleModal(false)">&times;</div>
      </div>
      <form onsubmit="handleCreateAd(event)">
        <div class="form-group">
          <label>Название товара</label>
          <input type="text" id="adTitle" placeholder="Например, iPhone 13" required />
        </div>
        <div class="form-group">
          <label>Описание</label>
          <textarea id="adDesc" placeholder="Опишите состояние товара..." rows="2"></textarea>
        </div>
        <div class="form-group">
          <label>Цена (₽)</label>
          <input type="number" id="adPrice" placeholder="0" required />
        </div>
        <div class="form-group">
          <label>Категория</label>
          <select id="adCategory">
            <option value="tech">Техника</option>
            <option value="auto">Авто</option>
            <option value="home">Жилье</option>
            <option value="furniture">Мебель</option>
            <option value="clothes">Одежда</option>
            <option value="work">Работа</option>
          </select>
        </div>
        <div class="form-group">
          <label>Город Удмуртии</label>
          <input type="text" id="adCity" placeholder="Ижевск, Воткинск, Глазов..." value="Ижевск" required />
        </div>
        <button type="submit" class="form-submit">Разместить на Полке</button>
      </form>
    </div>
  </div>

  <script>
    // Вставь сюда актуальный адрес твоего URL ngrok
    const API_URL = 'https://endorphin-trump-cavalier.ngrok-free.dev/api';

    const assets = {
      logo: 'https://i.postimg.cc/5QSkYwbd/polka-logo-2-png.png',
      user: 'https://i.postimg.cc/gLWT2MFG/icons8-user-64.png',
      categories: {
        auto: 'https://i.postimg.cc/sGrNgnFL/icons8-avtomobil-100.png',
        home: 'https://i.postimg.cc/4HgSx8CD/icons8-zdanie-s-terrasoj-na-kryse-100.png',
        furniture: 'https://i.postimg.cc/SYhvxZ0w/icons8-mebel-100.png',
        clothes: 'https://i.postimg.cc/4HgSx8kZ/icons8-futbolka-100.png',
        tech: 'https://i.postimg.cc/xN241sDQ/icons8-printer-100.png',
        work: 'https://i.postimg.cc/xN241sD2/icons8-rabota-100.png',
      }
    };

    const state = {
      activeTab: 'home',
      activeCategory: 'all',
      ads: [],
      searchQuery: '',
      myUserId: 668567292, // Твой моковый или реальный VK ID
      isLoading: true
    };

    const categories = [
      { id: 'all', title: 'Все', icon: assets.logo },
      { id: 'auto', title: 'Авто', icon: assets.categories.auto },
      { id: 'tech', title: 'Техника', icon: assets.categories.tech },
      { id: 'home', title: 'Жильё', icon: assets.categories.home },
      { id: 'furniture', title: 'Мебель', icon: assets.categories.furniture },
      { id: 'clothes', title: 'Одежда', icon: assets.categories.clothes },
      { id: 'work', title: 'Работа', icon: assets.categories.work },
    ];

    async function initVK() {
      try { await vkBridge.send('VKWebAppInit'); } catch (e) { console.log(e); }
    }

    // Загрузка объявлений из базы бэкенда
    async function loadAds() {
      try {
        state.isLoading = true;
        updateFeedContainer();
        
        let url = `${API_URL}/ads`;
        if (state.activeTab === 'profile') {
          url += `?user_id=${state.myUserId}`;
        } else if (state.activeCategory !== 'all') {
          url += `?category=${state.activeCategory}`;
        }

        const response = await fetch(url);
        if (!response.ok) throw new Error();
        state.ads = await response.json();
      } catch (e) {
        console.error("Ошибка сети бэкенда:", e);
      } finally {
        state.isLoading = false;
        updateFeedContainer();
      }
    }

    function toggleModal(show) {
      document.getElementById('createModal').style.display = show ? 'flex' : 'none';
    }

    // Сохранение в базу через POST
    async function handleCreateAd(event) {
      event.preventDefault();
      
      const title = document.getElementById('adTitle').value;
      const description = document.getElementById('adDesc').value;
      const price = document.getElementById('adPrice').value;
      const category = document.getElementById('adCategory').value;
      const city = document.getElementById('adCity').value;

      const newAd = {
        user_id: state.myUserId,
        title: title,
        description: description,
        price: Number(price),
        category: category,
        city: city || 'Ижевск',
        photo: "https://i.ibb.co/cKQX5bpD/Frame-184.png"
      };

      toggleModal(false);

      try {
        const response = await fetch(`${API_URL}/ads`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(newAd)
        });
        if (response.ok) {
          // Чистим форму
          document.getElementById('adTitle').value = '';
          document.getElementById('adDesc').value = '';
          document.getElementById('adPrice').value = '';
          // Перегружаем актуальные данные
          await loadAds();
        }
      } catch (err) {
        console.error("Не удалось отправить POST:", err);
      }
    }

    // Умное переключение Избранного через localStorage
    function toggleFavorite(adId, event) {
      if(event) event.stopPropagation();
      let favorites = JSON.parse(localStorage.getItem('fav_ads') || '[]');
      if (favorites.includes(adId)) {
        favorites = favorites.filter(id => id !== adId);
      } else {
        favorites.push(adId);
      }
      localStorage.setItem('fav_ads', JSON.stringify(favorites));
      
      if (state.activeTab === 'favorites') {
        updateFeedContainer();
      } else {
        const btn = document.getElementById(`fav-btn-${adId}`);
        if(btn) btn.innerHTML = favorites.includes(adId) ? '❤️' : '♡';
      }
    }

    function isFavorite(adId) {
      const favorites = JSON.parse(localStorage.getItem('fav_ads') || '[]');
      return favorites.includes(adId);
    }

    // Поиск «на лету» без перезаписи инпута (фокус не пропадает!)
    function handleSearchInput(value) {
      state.searchQuery = value.toLowerCase().strip ? value.toLowerCase().trim() : value.toLowerCase();
      const cards = document.querySelectorAll('.feed .card');
      cards.forEach(card => {
        const title = card.querySelector('.title').textContent.toLowerCase();
        const city = card.querySelector('.meta').textContent.toLowerCase();
        if (title.includes(state.searchQuery) || city.includes(state.searchQuery)) {
          card.style.display = 'block';
        } else {
          card.style.display = 'none';
        }
      });
    }

    // Отрисовка только контента ленты (чтобы не перерисовывать верхний Поиск!)
    function updateFeedContainer() {
      const container = document.getElementById('main-tab-content');
      if (!container) return;

      if (state.activeTab === 'home' || state.activeTab === 'favorites' || state.activeTab === 'profile') {
        let displayAds = state.ads;

        // Фильтр Избранного
        if (state.activeTab === 'favorites') {
          const favorites = JSON.parse(localStorage.getItem('fav_ads') || '[]');
          displayAds = state.ads.filter(ad => favorites.includes(ad.id));
        }

        if (state.isLoading) {
          container.innerHTML = `<div class="empty-feed">🔄 Загрузка объявлений из базы...</div>`;
          return;
        }

        if (displayAds.length === 0) {
          container.innerHTML = `<div class="empty-feed">📦 Ничего не найдено. Нажмите «+», чтобы добавить объявление.</div>`;
          return;
        }

        const feedHtml = displayAds.map(ad => `
          <div class="card">
            <div class="fav-badge" id="fav-btn-${ad.id}" onclick="toggleFavorite(${ad.id}, event)">
              ${isFavorite(ad.id) ? '❤️' : '♡'}
            </div>
            <div class="card-photo">
              <img src="${ad.photo}" />
            </div>
            <div class="card-body">
              <div class="price">${Number(ad.price).toLocaleString('ru-RU')} ₽</div>
              <div class="title">${ad.title}</div>
              <div class="meta">
                <div>📍 ${ad.city || 'Удмуртия'}</div>
                <div class="seller"><img src="${assets.user}" /> ${ad.seller || 'Продавец'}</div>
              </div>
            </div>
          </div>
        `).join('');

        container.innerHTML = `<div class="feed">${feedHtml}</div>`;
        // Применяем текущий поисковый запрос, если он был введен
        if(state.searchQuery) handleSearchInput(state.searchQuery);

      } else if (state.activeTab === 'chats') {
        container.innerHTML = `
          <div class="tab-content">
            <div class="chat-item">
              <div class="chat-avatar">🚙</div>
              <div>
                <strong>Алексей (Ижевск)</strong>
                <div style="color:var(--sub);font-size:14px;margin-top:4px;">Здравствуйте! Торг на ВАЗ уместен?</div>
              </div>
            </div>
            <div class="chat-item">
              <div class="chat-avatar">📱</div>
              <div>
                <strong>Мария (Воткинск)</strong>
                <div style="color:var(--sub);font-size:14px;margin-top:4px;">Где можно забрать айфон?</div>
              </div>
            </div>
          </div>
        `;
      }
    }

    function renderStructure() {
      const app = document.getElementById('app');
      
      app.innerHTML = `
        <div class="topbar">
          <div class="topbar-row">
            <div class="logo-wrap">
              <img class="logo" src="${assets.logo}" />
              <div class="brand">Полка</div>
            </div>
            <div class="top-actions">
              <div class="user-btn" onclick="switchTab('profile')"><img src="${assets.user}" /></div>
            </div>
          </div>
          ${state.activeTab === 'home' ? `
            <div class="search">
              🔍 <input id="searchBar" placeholder="Поиск объявлений..." oninput="handleSearchInput(this.value)" />
            </div>
          ` : ''}
        </div>

        ${state.activeTab === 'home' ? `
          <div class="hero">
            <h2>Маркетплейс<br />Удмуртии</h2>
            <p>Покупай, продавай и находи всё рядом в общем каталоге.</p>
          </div>
          <div class="categories">
            ${categories.map(cat => `
              <div class="cat ${state.activeCategory === cat.id ? 'active' : ''}" onclick="selectCategory('${cat.id}')">
                <img src="${cat.icon}" />
                <div class="cat-title">${cat.title}</div>
              </div>
            `).join('')}
          </div>
          <div class="page-title">Рекомендации</div>
        ` : `
          <div class="page-title">${state.activeTab === 'favorites' ? '❤️ Избранное' : state.activeTab === 'chats' ? '💬 Чаты' : '👤 Мой профиль (id' + state.myUserId + ')'}</div>
        `}

        <div id="main-tab-content"></div>

        <div class="bottom-nav">
          <div class="nav-item ${state.activeTab === 'home' ? 'active' : ''}" onclick="switchTab('home')">
            <div class="nav-icon">🏠</div>Главная
          </div>
          <div class="nav-item ${state.activeTab === 'favorites' ? 'active' : ''}" onclick="switchTab('favorites')">
            <div class="nav-icon">♡</div>Избранное
          </div>
          <div class="create-btn" onclick="toggleModal(true)">+</div>
          <div class="nav-item ${state.activeTab === 'chats' ? 'active' : ''}" onclick="switchTab('chats')">
            <div class="nav-icon">💬</div>Чаты
          </div>
          <div class="nav-item ${state.activeTab === 'profile' ? 'active' : ''}" onclick="switchTab('profile')">
            <div class="nav-icon">👤</div>Профиль
          </div>
        </div>
      `;

      updateFeedContainer();
    }

    function selectCategory(id) {
      state.activeCategory = id;
      renderStructure();
      loadAds();
    }

    function switchTab(tabId) {
      state.activeTab = tabId;
      renderStructure();
      loadAds();
    }

    initVK();
    renderStructure();
    loadAds();
  </script>
</body>
</html>
